[package]
name = "veyyon-gui-features"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "The desktop front end's surfaces and content renderers."

# WHAT THIS CRATE MAY SEE.
#
# core for what to draw, kit for what to draw it with. It never sees the window
# type, because a surface that names the view it lives in cannot be moved.
[dependencies]
gpui = { workspace = true }
veyyon-gui-core = { path = "../core" }
veyyon-gui-kit = { path = "../kit" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
