[package]
name = "veyyon-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "The veyyon desktop window."

[[bin]]
name = "veyyon-gui"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
serde_json = { workspace = true }
veyyon-gui-core = { path = "../core" }
veyyon-gui-kit = { path = "../kit" }
veyyon-gui-features = { path = "../features" }

# The windowed suite drives a real gpui window headlessly: focus, keystrokes and
# clicks. It is the only way a route's keyboard reachability is checkable without
# a display.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
