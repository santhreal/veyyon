# Upstream radar: veyyon forked can1357/oh-my-pi and diverged, but upstream
# ships real-world fixes faster than any human can triage. Every 30 minutes
# this mirrors each newly MERGED upstream PR into one issue labeled
# `upstream-port`. veybot (python/veybot) watches that label and turns each
# issue into one candidate port PR. Humans and autoreview.yml gate the merge.
# Idempotent: dedup is a marker in the issue body (see scripts/upstream-radar.ts).
name: Upstream radar

on:
  schedule:
    # Every 30 minutes, offset to avoid the on-the-hour cron stampede.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-radar
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  radar:
    name: Mirror merged upstream PRs into port issues
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # The shared composite, for the cached store: this job runs every 30
      # minutes, and an uncached `bun install` re-downloads the whole workspace
      # each time. The static issue template is rendered through
      # @veyyon/utils/prompt, so the package links have to exist.
      - uses: ./.github/actions/bun-install
      - name: Run the radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/upstream-radar.ts
