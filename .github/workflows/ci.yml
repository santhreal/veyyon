name: CI

# A release is a tag push. `scripts/release-cut.ts` prepares the version bump on
# the operator's machine, that commit reaches main through an ordinary push and
# is tested by the main run below, and pushing `vX.Y.Z` at the green commit is
# the release. Nothing dispatches this workflow to publish, so there is no
# controller run to correlate and no nonce: the `release_metadata` job proves
# the tagged commit is on main, which is what makes it a commit CI has tested.
on:
   push:
      branches: [main]
      tags: ["v*"]
   pull_request:
      branches: [main]
   workflow_dispatch:

# A tag run publishes, and a later main push must never cancel it: sharing the
# branch-wide `CI-refs/heads/main` group once cancelled an in-flight release and
# left the tag without a GitHub Release (#2564).
#
# Every push to main now gets its own per-sha group too, for the same reason one
# step further out. A single shared main group holds ONE pending run, so on a
# repository pushing to main several times an hour the runs do not queue politely:
# 2026-08-09 read four cancelled, two stuck queued for over an hour, one failure
# and zero successes across the last twenty-five main runs, which is a release
# train that can never depart because no commit on main is ever green. Runs at
# distinct shas are independent questions and now answer in parallel; what they
# compete for is runners, and a runner queue drains while a cancelled run does
# not. A tag and its bump commit share a sha, so the tag keeps a DIFFERENT prefix
# and cannot land in the same group as the main run that tested it.
#
# Pull requests and other branches keep branch-wide cancellation, which is where
# superseding a run is the right answer.
concurrency:
   group: "${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.sha) || (github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.ref) }}"
   cancel-in-progress: "${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # glibc floor for shipped linux native addons. A stock Ubuntu runner links its
   # own (newer) glibc symbol versions and would fail to dlopen on older distros.
   # Building the linux-gnu addons through cargo-zigbuild against this floor keeps
   # them portable. MIRROR: the owner of this value is
   # packages/natives/scripts/native-portability.ts (GLIBC_FLOOR); update both —
   # native-portability.test.ts fails on drift. Bump to raise the minimum glibc.
   GLIBC_FLOOR: "2.17"

permissions:
   contents: read
   actions: read

jobs:
   # An operator pushes `vX.Y.Z` at a main commit this workflow already tested,
   # and that tag push starts the run below. `release_metadata` resolves the tag
   # once and proves it points at a commit on main, so downstream jobs switch on
   # `is-release` and address it by name. Ordinary contributor pushes and pull
   # requests still run CI without publishing.
   release_metadata:
      name: Resolve release metadata
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
      steps:
         # No tags needed here. The tag case reads its name from
         # `github.ref_name`, and the main case only reports that main never
         # publishes. This step once ran `git tag --points-at HEAD` and carried
         # a `fetch-tags` input for it; the command is gone, and under checkout
         # v6 the input is no longer the no-op it was under v4, so leaving it
         # would fetch every tag on every main run for nothing.
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         # Only a tag run reads the tooling; an ordinary main push resolves
         # "not a release" from the ref alone and installs nothing.
         - uses: ./.github/actions/bun-install
           if: startsWith(github.ref, 'refs/tags/')
         - name: Detect release tag at HEAD
           id: detect
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           shell: bash
           run: |
              is_release=false
              release_tag=""
              case "${{ github.ref }}" in
                refs/tags/*)
                  release_tag="${{ github.ref_name }}"
                  if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::release tag '$release_tag' is not strict vX.Y.Z semver"
                    exit 1
                  fi
                  bun scripts/release.ts verify-tag "$release_tag" "${{ github.sha }}"
                  echo "$release_tag is on main and its tree agrees with it."
                  is_release=true
                  ;;
                refs/heads/main)
                  echo "Main CI never publishes; pushing a v* tag at a green main commit does."
                  ;;
              esac
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
              } >> "$GITHUB_OUTPUT"

   # Exercise the release-notes generator on every main push / PR, not only when
   # a real `v*` tag is cut. release_github (the job that actually runs
   # ci-release-notes.ts) is tag-only, so a runtime bug in that script never
   # touches main CI and only surfaces when a doomed tag is already published —
   # this is how v1.0.13-1.0.21 shipped with broken release jobs. This job runs
   # the generator against the latest published tag (a known-good target,
   # reproducing that release's notes) so a crash, a bad git range, a gh output
   # change, or an empty body is caught here, before any tag exists. It never
   # publishes anything.
   release_notes_dryrun:
      name: Release notes dry-run
      runs-on: ubuntu-22.04
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              # The generator does `git log vPREV..vTARGET`, so it needs full
              # history and the tag refs — the same requirement as release_github.
              fetch-depth: 0
              fetch-tags: true
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Generate notes for the latest published release
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           shell: bash
           run: |
              set -euo pipefail
              tag=$(gh release list --repo "${{ github.repository }}" --limit 1 \
                    --exclude-drafts --exclude-pre-releases --json tagName \
                    --jq '.[0].tagName // ""')
              if [ -z "$tag" ]; then
                echo "No published release yet; nothing to dry-run. (First release generates notes for the first time on its own tag.)"
                exit 0
              fi
              echo "Dry-running ci-release-notes.ts against $tag ..."
              bun scripts/ci-release-notes.ts "$tag" release-notes-dryrun.md
              if [ ! -s release-notes-dryrun.md ]; then
                echo "::error::ci-release-notes.ts produced an EMPTY body for $tag. A published release with real commits must not ship an empty body."
                exit 1
              fi
              echo "--- generated notes ($(wc -l < release-notes-dryrun.md) lines) ---"
              cat release-notes-dryrun.md

   # Compute a stable hash of every input that affects the native cdylib output,
   # then look for any prior successful main run that already uploaded the
   # native artifacts for this hash. Two independent outputs:
   #   * `linux-x64-run-id` — set when BOTH linux x64 variants
   #     (`baseline` and `modern`) are present on a prior main run, so
   #     native-dependent TS test jobs and `native_linux_x64` can reuse it.
   #   * `cross-platform-run-id` — set when the complete Linux x64 and
   #     cross-platform artifact set is present and non-expired on that same
   #     prior run, so `native_cross_platform` can skip the cold rebuild on
   #     main pushes after dep changes have already warmed sccache there.
   # Non-release native jobs are skipped only for complete artifact sets; the
   # artifact retention window (see build-native action) is the effective TTL.
   native_artifact_lookup:
      name: Look up cached native artifacts
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      outputs:
         source-hash: ${{ steps.compute.outputs.source-hash }}
         linux-x64-run-id: ${{ steps.find.outputs.linux-x64-run-id }}
         cross-platform-run-id: ${{ steps.find.outputs.cross-platform-run-id }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Compute native source hash
           id: compute
           shell: bash
           run: |
              source_hash=$(find crates Cargo.toml Cargo.lock rust-toolchain.toml \
                      packages/natives/scripts packages/natives/package.json \
                      scripts/ci-build-native.ts scripts/host-detect.ts \
                      .github/actions/build-native/action.yml \
                      -type f -print0 \
                    | sort -z \
                    | xargs -0 sha256sum \
                    | sha256sum \
                    | cut -c1-16)
              echo "source-hash=$source_hash" >> "$GITHUB_OUTPUT"
              echo "Native source hash: $source_hash"
         - name: Find prior main build with matching native artifacts
           id: find
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           shell: bash
           run: |
              hash="${{ steps.compute.outputs.source-hash }}"
              # Required names must match the `actions/upload-artifact` `name:`
              # template in the build-native action. Both x64 variants are
              # independent matrix jobs, so neither one's presence implies the other.
              linux_x64_required=(
                "veyyon-natives-linux-x64-baseline-h${hash}"
                "veyyon-natives-linux-x64-modern-h${hash}"
              )
              cross_platform_required=(
                "${linux_x64_required[@]}"
                "veyyon-natives-linux-arm64-h${hash}"
                "veyyon-natives-darwin-x64-baseline-h${hash}"
                "veyyon-natives-darwin-arm64-h${hash}"
                "veyyon-natives-win32-x64-baseline-h${hash}"
              )
              linux_x64_run_id=""
              cross_platform_run_id=""
              # Any run that UPLOADED the artifact counts, whatever the run's own
              # conclusion was. `--status=success` used to be here, and it made the
              # cache miss exactly when it is worth most: a red or cancelled main run
              # still built and uploaded valid addons, so a red streak charged every
              # push six native builds again (34 of the 56 runner-minutes one main push
              # costs, including four macOS/Windows slots against a ~20-job ceiling).
              # Validity comes from the source hash in the artifact NAME, not from
              # whether some unrelated test bucket passed in the same run.
              for candidate in $(gh run list \
                  --repo "${{ github.repository }}" \
                  --workflow=ci.yml --branch=main --event=push \
                  --limit=20 --json databaseId --jq='.[].databaseId'); do
                names=$(gh api "/repos/${{ github.repository }}/actions/runs/$candidate/artifacts?per_page=100" \
                    --jq '.artifacts[] | select(.expired == false) | .name')
                if [ -z "$linux_x64_run_id" ]; then
                  all_found=true
                  for req in "${linux_x64_required[@]}"; do
                    if ! echo "$names" | grep -qFx "$req"; then
                      all_found=false
                      break
                    fi
                  done
                  if $all_found; then
                    linux_x64_run_id="$candidate"
                  fi
                fi
                if [ -z "$cross_platform_run_id" ]; then
                  all_found=true
                  for req in "${cross_platform_required[@]}"; do
                    if ! echo "$names" | grep -qFx "$req"; then
                      all_found=false
                      break
                    fi
                  done
                  if $all_found; then
                    cross_platform_run_id="$candidate"
                  fi
                fi
                if [ -n "$linux_x64_run_id" ] && [ -n "$cross_platform_run_id" ]; then
                  break
                fi
              done
              if [ -n "$linux_x64_run_id" ]; then
                echo "Reusing Linux x64 native artifacts from run $linux_x64_run_id"
              else
                echo "No cached Linux x64 native artifacts for hash $hash; native_linux_x64 will rebuild."
              fi
              if [ -n "$cross_platform_run_id" ]; then
                echo "Reusing cross-platform native artifacts from run $cross_platform_run_id"
              else
                echo "No cached cross-platform native artifacts for hash $hash; native_cross_platform will rebuild on main."
              fi
              {
                echo "linux-x64-run-id=$linux_x64_run_id"
                echo "cross-platform-run-id=$cross_platform_run_id"
              } >> "$GITHUB_OUTPUT"

   # Type check and the browser bundle build (no Rust, no native build needed).
   # Lint, formatting and import order are checks.yml's `lint-and-typecheck`, which
   # is the one owner of Biome: this job never ran it, and the job title used to say
   # "Lint" anyway, so the absence read as coverage. Naming a job for what it runs
   # is the same lesson checks.yml records about its own "Biome check" step that ran
   # pure TypeScript.
   check:
      name: Type check & web build
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/bun-install
         - name: Type check workspace
           run: bun run check:ts
         - name: Build collab web
           run: bun run collab:web:build

   # Linux x64 baseline + modern: required by `test`, so it runs on every PR
   # unless native_artifact_lookup found a cached run. Release runs always
   # rebuild for fresh artifacts.
   native_linux_x64:
      name: "Native: Linux x64 (${{ matrix.variant }})"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-release == 'true' || needs.native_artifact_lookup.outputs.linux-x64-run-id == '' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            variant: [baseline, modern]
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/build-native
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: linux
              arch: x64
              variant: ${{ matrix.variant }}
              glibc: ${{ env.GLIBC_FLOOR }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

   # Pre-warm the cross-platform native build cache on `main`, in addition to
   # building the artifacts that ship in releases. Skipped on main when
   # native_artifact_lookup already found a recent run with all artifacts intact.
   native_cross_platform_cross:
      name: "Native: ${{ matrix.platform }} ${{ matrix.arch }}"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native_artifact_lookup.outputs.cross-platform-run-id == '') }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
               - { os: ubuntu-22.04, platform: win32, arch: x64, target: x86_64-pc-windows-msvc, variant: baseline }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/build-native
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: ${{ matrix.platform }}
              arch: ${{ matrix.arch }}
              variant: ${{ matrix.variant }}
              target: ${{ matrix.target }}
              glibc: ${{ matrix.platform == 'linux' && env.GLIBC_FLOOR || '' }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

   native_cross_platform_macos:
      name: "Native: ${{ matrix.platform }} ${{ matrix.arch }}"
      needs: [release_metadata, native_artifact_lookup]
      if: ${{ needs.release_metadata.outputs.is-release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native_artifact_lookup.outputs.cross-platform-run-id == '') }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-15-intel, platform: darwin, arch: x64, variant: baseline }
               - { os: macos-14, platform: darwin, arch: arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/build-native
           with:
              hash: ${{ needs.native_artifact_lookup.outputs.source-hash }}
              platform: ${{ matrix.platform }}
              arch: ${{ matrix.arch }}
              variant: ${{ matrix.variant }}
              target: ${{ matrix.target }}
              save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
   test_workspace:
      name: Test TS workspace fast
      runs-on: ubuntu-22.04
      needs: [native_linux_x64, native_artifact_lookup]
      if: ${{ !cancelled() && needs.native_linux_x64.result != 'failure' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Resolve Linux x64 native artifact run
           id: source
           shell: bash
           run: |
              if [ "${{ needs.native_linux_x64.result }}" = "success" ]; then
                echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                echo "artifact-run-id=${{ needs.native_artifact_lookup.outputs.linux-x64-run-id }}" >> "$GITHUB_OUTPUT"
              fi
         - name: Download native addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
              run-id: ${{ steps.source.outputs.artifact-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Build the test sandbox image
           # Every `bun test` in this repo refuses to run unless it can PROVE the
           # operator's home is unreachable, so CI has to establish the same boundary
           # a workstation does or the contract holds on one machine only. On a
           # GitHub runner that is the container rung, and this builds the guest
           # userland it runs. There is no /dev/kvm here, so the script builds the
           # userland only and says so; the microVM rung reports itself unavailable
           # instead of being silently swapped for something weaker.
           run: bash scripts/test-sandbox/run.sh --build
         - name: Test workspace packages and repo scripts (TS)
           run: bun run ci:test:ts:workspace

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ubuntu-22.04
      needs: [native_linux_x64, native_artifact_lookup]
      if: ${{ !cancelled() && needs.native_linux_x64.result != 'failure' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Resolve Linux x64 native artifact run
           id: source
           shell: bash
           run: |
              if [ "${{ needs.native_linux_x64.result }}" = "success" ]; then
                echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                echo "artifact-run-id=${{ needs.native_artifact_lookup.outputs.linux-x64-run-id }}" >> "$GITHUB_OUTPUT"
              fi
         - name: Download native addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
              run-id: ${{ steps.source.outputs.artifact-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Build the test sandbox image
           # Every `bun test` in this repo refuses to run unless it can PROVE the
           # operator's home is unreachable, so CI has to establish the same boundary
           # a workstation does or the contract holds on one machine only. On a
           # GitHub runner that is the container rung, and this builds the guest
           # userland it runs. There is no /dev/kvm here, so the script builds the
           # userland only and says so; the microVM rung reports itself unavailable
           # instead of being silently swapped for something weaker.
           run: bash scripts/test-sandbox/run.sh --build
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ubuntu-22.04
      needs: [native_linux_x64, native_artifact_lookup]
      if: ${{ !cancelled() && needs.native_linux_x64.result != 'failure' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Resolve Linux x64 native artifact run
           id: source
           shell: bash
           run: |
              if [ "${{ needs.native_linux_x64.result }}" = "success" ]; then
                echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                echo "artifact-run-id=${{ needs.native_artifact_lookup.outputs.linux-x64-run-id }}" >> "$GITHUB_OUTPUT"
              fi
         - name: Download native addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
              run-id: ${{ steps.source.outputs.artifact-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Build the test sandbox image
           # Every `bun test` in this repo refuses to run unless it can PROVE the
           # operator's home is unreachable, so CI has to establish the same boundary
           # a workstation does or the contract holds on one machine only. On a
           # GitHub runner that is the container rung, and this builds the guest
           # userland it runs. There is no /dev/kvm here, so the script builds the
           # userland only and says so; the microVM rung reports itself unavailable
           # instead of being silently swapped for something weaker.
           run: bash scripts/test-sandbox/run.sh --build
         - name: Test native/TUI/browser-ish packages (TS)
           run: bun run ci:test:ts:native

   # Three buckets, one runner. Each of these was its own job, and each paid the
   # same checkout, `bun install`, artifact download and sandbox image build to
   # run a short bucket: 2.5 + 2.2 + 1.2 minutes of tests behind roughly three
   # minutes of duplicated setup, holding three slots. This account's runner pool
   # is shared with the owner's other repositories, so the scarce thing is a slot
   # and what waits for one is veyyon's own push. Every step keeps its own name
   # and runs even after an earlier one failed, so a red bucket still names
   # itself exactly as it did when it was a job.
   test_coding_agent_buckets:
      name: Test coding-agent UI/runtime/unit (TS)
      runs-on: ubuntu-22.04
      needs: [native_linux_x64, native_artifact_lookup]
      if: ${{ !cancelled() && needs.native_linux_x64.result != 'failure' }}
      timeout-minutes: 40
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Resolve Linux x64 native artifact run
           id: source
           shell: bash
           run: |
              if [ "${{ needs.native_linux_x64.result }}" = "success" ]; then
                echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                echo "artifact-run-id=${{ needs.native_artifact_lookup.outputs.linux-x64-run-id }}" >> "$GITHUB_OUTPUT"
              fi
         - name: Download native addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
              run-id: ${{ steps.source.outputs.artifact-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: Build the test sandbox image
           # Every `bun test` in this repo refuses to run unless it can PROVE the
           # operator's home is unreachable, so CI has to establish the same boundary
           # a workstation does or the contract holds on one machine only. On a
           # GitHub runner that is the container rung, and this builds the guest
           # userland it runs. There is no /dev/kvm here, so the script builds the
           # userland only and says so; the microVM rung reports itself unavailable
           # instead of being silently swapped for something weaker.
           run: bash scripts/test-sandbox/run.sh --build
         - name: Test coding-agent UI/TUI bucket
           run: bun run ci:test:coding-agent:ui
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; they are a
           # separate bucket for reporting, not as a native-free guardrail.
           if: ${{ !cancelled() }}
           run: bun run ci:test:coding-agent:runtime
         - name: Test coding-agent native/unit bucket
           if: ${{ !cancelled() }}
           run: bun run ci:test:coding-agent:native

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ubuntu-22.04
      needs: [native_linux_x64, native_artifact_lookup]
      if: ${{ !cancelled() && needs.native_linux_x64.result != 'failure' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Resolve Linux x64 native artifact run
           id: source
           shell: bash
           run: |
              if [ "${{ needs.native_linux_x64.result }}" = "success" ]; then
                echo "artifact-run-id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                echo "artifact-run-id=${{ needs.native_artifact_lookup.outputs.linux-x64-run-id }}" >> "$GITHUB_OUTPUT"
              fi
         - name: Download native addons
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-linux-x64-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
              run-id: ${{ steps.source.outputs.artifact-run-id }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      # install.sh is a shipped install channel on BOTH Linux and macOS, and the
      # gate ran on Linux only. macOS is where an installer breaks: BSD userland
      # rather than GNU, zsh as the default login shell rather than bash, and a
      # different completions layout. Running the same script on macos-14 is what
      # makes "the installer works" a claim about the platforms it ships to.
      name: "Install method smoke tests (${{ matrix.os }})"
      # An installer end-to-end run answers a question about a RELEASE
      # ARTIFACT, and it answers it by building the product from source on three
      # operating systems. On an ordinary push to main nothing publishes, so the
      # answer is not needed until the cut, and the cost is not free: this matrix
      # takes two of the account's five concurrent macOS slots, which is the pool
      # a release tag has to get through. One main run measured 635 minutes of
      # queue wait against 82 minutes of execution. It still gates every release
      # (`release_binary` needs it), and it still runs on every pull request, so
      # an installer change is proven before it lands and again before it ships.
      if: ${{ needs.release_metadata.outputs.is-release == 'true' || github.event_name != 'push' }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            # macos-14 is arm64 and macos-15-intel is x64. Each runner builds and
            # installs its own architecture, so both shipped macOS binaries get
            # their install path exercised rather than only the one the release
            # happens to be cut on.
            os: [ubuntu-22.04, macos-14, macos-15-intel]
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/ensure-rust-toolchain
           with:
              toolchain: nightly-2026-04-29
         - name: Setup sccache
           uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
         - name: Enable sccache for cargo
           # sccache-action exports the GHA cache URL/token; CARGO_INCREMENTAL=0
           # keeps sccache from silently no-oping.
           shell: bash
           run: |
              {
                echo "RUSTC_WRAPPER=sccache"
                echo "CARGO_INCREMENTAL=0"
                echo "SCCACHE_GHA_ENABLED=true"
              } >> "$GITHUB_ENV"
              echo "sccache backend: GitHub Actions cache"
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - name: Install method smoke tests
           run: bun run ci:test:install-methods

   install_ps1_e2e:
      # The Windows counterpart of install_methods. The function tests below
      # cover the pure helpers and the release verify job downloads the published
      # .exe and runs --version on it, but neither runs install.ps1 itself, so
      # everything the installer does AROUND the binary (the vey.cmd shim, the
      # user PATH entry, completions wired into the PowerShell profile, the
      # doctor self-test, and uninstall reclaiming all of it) had never executed
      # on Windows even once. -Local installs the binary built here, so this
      # needs no published release.
      name: Windows installer end-to-end
      # Same rule as install_methods: a release gate and a pull-request gate, not
      # a per-push cost. It builds the native addon and the binary on Windows,
      # which is the longest single job in the workflow.
      if: ${{ needs.release_metadata.outputs.is-release == 'true' || github.event_name != 'push' }}
      needs: [release_metadata]
      runs-on: windows-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: ./.github/actions/bun-install
         - name: Build the native addon and the binary
           # bash, not pwsh: the bun-install action puts bun on PATH for the
           # runner's bash shell, and a pwsh step does not inherit it, so this
           # step died with "The term 'bun' is not recognized" and took the whole
           # Windows end-to-end job with it. Only the test step below needs pwsh.
           shell: bash
           run: |
              bun --cwd=packages/natives run build
              bun --cwd=packages/coding-agent run build
         - name: install.ps1 end-to-end (install, reinstall, uninstall)
           shell: pwsh
           env:
              # The script refuses to run without this, because it edits the user
              # PATH and the PowerShell profile for real (both restored after).
              VEYYON_INSTALL_E2E: "1"
           run: pwsh -File scripts/install-tests/e2e.test.ps1

   install_ps1_functions:
      name: Windows installer function tests
      # install.ps1 is a shipped install channel; run its helper-function tests
      # on a real Windows shell so the PATH-wiring logic (which never ran on the
      # Linux runners) is actually gated. pwsh ships on windows-latest.
      runs-on: windows-latest
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: install.ps1 function tests
           shell: pwsh
           run: pwsh -File scripts/install-tests/functions.test.ps1

   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_linux_x64.result == 'success' && needs.native_cross_platform_cross.result ==
         'success' && needs.native_cross_platform_macos.result == 'success' &&
         needs.test_workspace.result == 'success' &&
         needs.test_coding_agent_singleton.result == 'success' &&
         needs.test_ts_native.result == 'success' &&
         needs.test_coding_agent_buckets.result == 'success' &&
         needs.test_smoke.result == 'success' && needs.check.result == 'success' &&
         needs.install_methods.result == 'success' &&
         needs.install_ps1_e2e.result == 'success' &&
         needs.install_ps1_functions.result == 'success' }}
      needs: [release_metadata, check, native_linux_x64, native_cross_platform_cross, native_cross_platform_macos, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_buckets, test_smoke, install_methods, install_ps1_e2e, install_ps1_functions, native_artifact_lookup]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/veyyon-linux-x64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/veyyon-linux-arm64,
                 }
               - {
                    os: macos-15-intel,
                    platform: darwin,
                    arch: x64,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/veyyon-darwin-x64,
                 }
               - {
                    os: macos-14,
                    platform: darwin,
                    arch: arm64,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/veyyon-darwin-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/veyyon-windows-x64.exe,
                 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         # The shared composite: bun, the cached store with its corrupt-tarball
         # retry, and the gitignored source codegen the compile reads.
         - uses: ./.github/actions/bun-install
         - name: Download native addon(s)
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-${{ matrix.platform }}-${{ matrix.arch }}*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/natives/native
              merge-multiple: true
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the napi
         # entry-point exports (see build-native action) and the bun
         # `--compile --target=bun-windows-x64-*` cross-compile.
         - name: Smoke release binary
           if: matrix.platform != 'win32'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: veyyon-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   release_github:
      name: Prepare draft GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_binary, native_artifact_lookup]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      permissions:
         contents: write
      outputs:
         release-id: ${{ steps.draft.outputs.release-id }}
         already-published: ${{ steps.draft.outputs.already-published }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              # Full history + tags so ci-release-notes.ts can `git log
              # vPREV..vTARGET` for the commit-history summary. A shallow
              # default checkout has neither the range's commits nor the tag
              # refs, so the summary would be skipped and the body would fall
              # back to the (often one-line) curated changelog.
              fetch-depth: 0
              fetch-tags: true
         - uses: ./.github/actions/bun-install
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Download native addons
           # Published as release assets so SOURCE installs stay toolchain-free:
           # ensure-native.ts fetches `veyyon_natives.<platform>-<arch>[-variant].node`
           # from the checkout's own release tag instead of requiring cargo.
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: veyyon-natives-*-h${{ needs.native_artifact_lookup.outputs.source-hash }}
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Generate SHA-256 sidecars
           # install.sh / install.ps1 / ensure-native.ts fail closed when a
           # published asset has no <asset>.sha256 sidecar, so every binary and
           # native addon must get one here.
           run: |
              cd packages/coding-agent/binaries
              ls -la
              for f in veyyon-* veyyon_natives.*; do
                [ -f "$f" ] || continue
                case "$f" in *.sha256) continue ;; esac
                sha256sum "$f" > "$f.sha256"
              done
              cat ./*.sha256
         - name: Create or resume the immutable draft release
           id: draft
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
              RELEASE_SHA: ${{ github.sha }}
           shell: bash
           run: |
              set -euo pipefail
              repo="$GITHUB_REPOSITORY"
              tag="$RELEASE_TAG"
              binaries="packages/coding-agent/binaries"
              shopt -s nullglob
              assets=("$binaries"/veyyon-* "$binaries"/veyyon_natives.*)
              if [ "${#assets[@]}" -eq 0 ]; then
                echo "::error::no release assets were assembled"
                exit 1
              fi
              printf '%s\n' "${assets[@]##*/}" | LC_ALL=C sort > local-assets.txt
              for asset in "${assets[@]}"; do
                digest="$(sha256sum "$asset")"
                printf '%s  %s\n' "${digest%% *}" "${asset##*/}"
              done | LC_ALL=C sort -k2 > local-assets.sha256
              if [ "$(uniq -d local-assets.txt | wc -l)" -ne 0 ]; then
                echo "::error::duplicate release asset names"
                exit 1
              fi

              # A draft is INVISIBLE to the by-tag endpoint. GitHub only resolves
              # /releases/tags/<tag> for a PUBLISHED release, because a draft has no
              # git tag standing behind it yet. Reading a just-created draft back
              # through that endpoint is what failed seven release attempts in a row:
              # each one 404'd on its own draft, failed verification, and left the
              # draft behind, so the next attempt burned the next version number.
              # v1.0.40 through v1.0.45 are still sitting unpublished from that.
              #
              # Creating through REST fixes the CREATE half, because the POST response
              # is the draft JSON itself. This lookup is the RESUME half, and it has to
              # enumerate /releases, which lists drafts, rather than ask by tag, which
              # never does. Asking by tag here meant a retry could never find the draft
              # it already owned and would POST a second one against the same tag.
              existing_ids="$(
                gh api --paginate "repos/$repo/releases" \
                  --jq '.[] | select(.tag_name == $ENV.RELEASE_TAG) | .id'
              )"
              id_count="$(printf '%s\n' "$existing_ids" | awk 'NF{n++} END{print n+0}')"
              if [ "$id_count" -gt 1 ]; then
                echo "::error::tag $tag is carried by $id_count releases ($(printf '%s' "$existing_ids" | tr '\n' ' ')); refusing to guess which one to publish"
                exit 1
              fi
              if [ "$id_count" -eq 1 ]; then
                release_json="$(gh api "repos/$repo/releases/$existing_ids")"
              else
                # ci-release-notes.ts already includes every commit and enforces
                # GitHub's body limit.
                release_json="$(
                  gh api --method POST "repos/$repo/releases" \
                    -f tag_name="$tag" -f name="$tag" \
                    -F draft=true -F prerelease=false -F body=@release-notes.md
                )"
              fi

              release_id="$(jq -r '.id' <<<"$release_json")"
              actual_tag="$(jq -r '.tag_name' <<<"$release_json")"
              is_draft="$(jq -r '.draft' <<<"$release_json")"
              ref_json="$(gh api "repos/$repo/git/ref/tags/$tag")"
              ref_type="$(jq -r '.object.type' <<<"$ref_json")"
              ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
              if [ -z "$release_id" ] || [ "$release_id" = null ]; then
                echo "::error::release API returned no id for $tag"
                exit 1
              fi
              if [ "$actual_tag" != "$tag" ]; then
                echo "::error::release API returned tag $actual_tag, expected $tag"
                exit 1
              fi
              if [ "$ref_type" != commit ] || [ "$ref_sha" != "$RELEASE_SHA" ]; then
                echo "::error::tag $tag resolves to $ref_type $ref_sha, expected commit $RELEASE_SHA"
                exit 1
              fi

              if [ "$is_draft" != true ]; then
                gh api --paginate "repos/$repo/releases/$release_id/assets" \
                  --jq '.[].name' | LC_ALL=C sort > remote-assets.txt
                if ! diff -u local-assets.txt remote-assets.txt; then
                  echo "::error::published release $tag has a different asset manifest; refusing overwrite"
                  exit 1
                fi
                remote_dir="$(mktemp -d)"
                while IFS= read -r name; do
                  gh release download "$tag" --repo "$repo" --pattern "$name" --dir "$remote_dir"
                  if ! cmp -s "$binaries/$name" "$remote_dir/$name"; then
                    echo "::error::published asset $name differs byte-for-byte; refusing overwrite"
                    exit 1
                  fi
                done < local-assets.txt
                {
                  echo "release-id=$release_id"
                  echo "already-published=true"
                } >> "$GITHUB_OUTPUT"
                echo "Published release $tag already has the exact immutable asset set; nothing changed."
                exit 0
              fi

              # A retry owns only this still-hidden draft. Clear any partial
              # upload before replacing it with the complete locally verified set.
              gh api --paginate "repos/$repo/releases/$release_id/assets" --jq '.[].id' |
                while IFS= read -r asset_id; do
                  [ -z "$asset_id" ] || gh api --method DELETE "repos/$repo/releases/assets/$asset_id"
                done
              gh release upload "$tag" --repo "$repo" "${assets[@]}"
              {
                echo "release-id=$release_id"
                echo "already-published=false"
              } >> "$GITHUB_OUTPUT"
         - name: Verify the exact draft asset manifest
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           # Five platform binaries, all required native addons, and a .sha256
           # sidecar for every artifact. Any missing/extra distribution asset or
           # unknown GitHub response keeps release_github red.
           run: bun scripts/release.ts verify-assets ${{ needs.release_metadata.outputs.release-tag }}
         - name: Preserve the verified asset digest manifest
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: veyyon-release-proof-${{ needs.release_metadata.outputs.release-tag }}
              path: local-assets.sha256
              retention-days: 1


   release_site:
      # Deploy the website and installer endpoint while the candidate remains a
      # draft. A failed deployment therefore leaves releases/latest on the prior
      # version instead of exposing a release whose install channels are stale.
      name: Deploy website (changelog autosync)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      concurrency:
         group: production-site-deploy
         cancel-in-progress: false
      permissions:
         contents: read
      env:
         HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
         HAS_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
         SITE_AUTODEPLOY: ${{ vars.SITE_AUTODEPLOY }}
      steps:
         - name: Require release Pages deployment credentials and policy
           run: |
              set -euo pipefail
              if [ "$SITE_AUTODEPLOY" = "off" ]; then
                echo "::error::SITE_AUTODEPLOY=off, but production site deployment is a required release artifact."
                exit 1
              fi
              if [ "$HAS_CF_TOKEN" != "true" ] || [ "$HAS_CF_ACCOUNT_ID" != "true" ]; then
                echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are both required for a release."
                exit 1
              fi
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Regenerate changelog + build site (brand check gates)
           # GITHUB_REPOSITORY is auto-set; gen-changelog reconciles against it.
           run: node website/build.mjs
         - name: Deploy to Cloudflare Pages (project veyyon → veyyon.dev)
           env:
              CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
           run: node website/deploy.mjs --skip-build
         # get.veyyon.dev is the `curl | sh` install endpoint. It deploys a
         # SEPARATE tree (website-get/: the two install scripts + a root rewrite
         # to install.sh) so its root serves the script, not the marketing
         # index.html — deploying the full website/ tree here put HTML at the get
         # root and broke `curl -fsSL https://get.veyyon.dev | sh`. build.mjs
         # generates website-get/. Redeploy on every release so the served
         # install script stays current. Same token/account; only the project
         # and the tree differ.
         - name: Deploy to Cloudflare Pages (project veyyon-get → get.veyyon.dev)
           env:
              CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              VEYYON_PAGES_PROJECT: veyyon-get
           run: node website/deploy.mjs --skip-build
         - name: Verify get.veyyon.dev serves THIS repository's install scripts
           # The deploy step returns before Cloudflare finishes propagating, and a
           # `wrangler deploy` exit 0 does NOT prove the root serves the script:
           # deploying the wrong tree once put the marketing index.html at the get
           # root. Digest verification keeps a stale deployment release-blocking.
           run: bun scripts/verify-deployed-installers.ts

   release_github_verify:
      name: Verify draft release (macOS)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: macos-14
      timeout-minutes: 20
      permissions:
         contents: write
      steps:
         - name: Download draft macOS arm64 binary and checksum sidecar
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_ID: ${{ needs.release_github.outputs.release-id }}
           run: |
              set -euo pipefail
              download_asset() {
                name="$1"
                asset_id="$(
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
                    --jq ".[] | select(.name == \"$name\") | .id"
                )"
                if [ -z "$asset_id" ]; then
                  echo "::error::draft release $RELEASE_ID has no asset named $name"
                  exit 1
                fi
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  -H "Accept: application/octet-stream" > "$name"
              }
              download_asset veyyon-darwin-arm64
              download_asset veyyon-darwin-arm64.sha256
              chmod +x veyyon-darwin-arm64
         - name: Verify the published .sha256 sidecar (install.sh fails closed without it)
           run: |
              # install.sh refuses to install any binary whose published checksum is
              # missing or mismatched, on every platform — so the darwin sidecar must
              # be verified here too, not only the linux one.
              shasum -a 256 -c veyyon-darwin-arm64.sha256
         - name: Verify published macOS arm64 binary
           run: |
              runtime_dir="$(mktemp -d)"
              # Assert the binary reports the version being released — a binary built
              # from the wrong commit (or a failed version-embed) would otherwise run
              # fine while reporting a stale version, and publish unnoticed.
              expected="${{ needs.release_metadata.outputs.release-tag }}"; expected="veyyon/${expected#v}"
              actual="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./veyyon-darwin-arm64 --version)"
              echo "reported: $actual (expected to contain: $expected)"
              case "$actual" in *"$expected"*) : ;; *) echo "::error::published macOS binary reports '$actual', expected '$expected'"; exit 1 ;; esac
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./veyyon-darwin-arm64 --smoke-test

   release_github_verify_linux:
      # linux-x64 is the most common `curl | sh` target, but the macOS verify job
      # above never launches it — a broken linux binary (or a native addon that
      # fails to load on a real launch) could publish unnoticed. Download the
      # published asset exactly as install.sh does, verify the .sha256 sidecar
      # install.sh requires, then run --version and --smoke-test in a clean HOME.
      # --smoke-test forces the core @veyyon/natives addon to load, so this is the
      # end-to-end proof that the shipped linux binary actually starts.
      name: Verify draft release (linux-x64)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      permissions:
         contents: write
      steps:
         - name: Download draft linux-x64 binary and checksum sidecar
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_ID: ${{ needs.release_github.outputs.release-id }}
           run: |
              set -euo pipefail
              download_asset() {
                name="$1"
                asset_id="$(
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
                    --jq ".[] | select(.name == \"$name\") | .id"
                )"
                if [ -z "$asset_id" ]; then
                  echo "::error::draft release $RELEASE_ID has no asset named $name"
                  exit 1
                fi
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  -H "Accept: application/octet-stream" > "$name"
              }
              download_asset veyyon-linux-x64
              download_asset veyyon-linux-x64.sha256
              chmod +x veyyon-linux-x64
         - name: Verify the published .sha256 sidecar (install.sh fails closed without it)
           run: |
              # The sidecar is `<hash>  veyyon-linux-x64`, so `-c` checks it against
              # the downloaded file. install.sh refuses to install a binary whose
              # published checksum is missing or mismatched, so a bad sidecar must
              # fail the release here, not a user's install.
              sha256sum -c veyyon-linux-x64.sha256
         - name: Launch the published linux-x64 binary (forces native-addon load)
           run: |
              runtime_dir="$(mktemp -d)"
              # Assert the reported version matches the release tag (catches a binary
              # built from the wrong commit / a failed version-embed that would run
              # fine but report a stale version).
              expected="${{ needs.release_metadata.outputs.release-tag }}"; expected="veyyon/${expected#v}"
              actual="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./veyyon-linux-x64 --version)"
              echo "reported: $actual (expected to contain: $expected)"
              case "$actual" in *"$expected"*) : ;; *) echo "::error::published linux binary reports '$actual', expected '$expected'"; exit 1 ;; esac
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./veyyon-linux-x64 --smoke-test

   release_github_verify_windows:
      # Windows is a first-class install channel (install.ps1), but neither verify
      # job above ever launches the Windows binary — a broken .exe, a missing/wrong
      # .sha256 sidecar (install.ps1 fails closed without it), or a native addon
      # that will not load on Windows could publish unnoticed. Download the
      # published asset exactly as install.ps1 does, verify the sidecar the way
      # install.ps1 requires (Get-FileHash), then run --version and --smoke-test in
      # a clean HOME. --smoke-test forces the core @veyyon/natives addon to load,
      # so this is the end-to-end proof that the shipped Windows binary starts.
      name: Verify draft release (windows-x64)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: windows-latest
      # The candidate remains private, but cap a hung Windows smoke-test so it
      # fails the transaction quickly instead of holding the draft indefinitely.
      timeout-minutes: 15
      permissions:
         contents: write
      steps:
         - name: Download draft windows-x64 binary and checksum sidecar
           shell: pwsh
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_ID: ${{ needs.release_github.outputs.release-id }}
           run: |
              function Get-DraftAsset([string] $Name) {
                $assetId = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" `
                  --jq ".[] | select(.name == `"$Name`") | .id"
                if ($LASTEXITCODE -ne 0) { throw "failed to list assets for draft release $env:RELEASE_ID" }
                if ([string]::IsNullOrWhiteSpace($assetId)) {
                  throw "draft release $env:RELEASE_ID has no asset named $Name"
                }
                $headers = @{
                  Authorization = "Bearer $env:GH_TOKEN"
                  Accept = "application/octet-stream"
                  "X-GitHub-Api-Version" = "2022-11-28"
                }
                Invoke-WebRequest `
                  -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId" `
                  -Headers $headers -OutFile $Name
              }
              Get-DraftAsset veyyon-windows-x64.exe
              Get-DraftAsset veyyon-windows-x64.exe.sha256
         - name: Verify the published .sha256 sidecar (install.ps1 fails closed without it)
           shell: pwsh
           run: |
              # The sidecar is "<hash>  veyyon-windows-x64.exe"; take the leading hash
              # token and compare it case-insensitively to the file's SHA-256, exactly
              # as install.ps1 does. A missing or mismatched sidecar fails the release
              # here rather than a user's install.
              $expected = ((Get-Content -Raw veyyon-windows-x64.exe.sha256).Trim() -split '\s+')[0].ToLower()
              if ([string]::IsNullOrWhiteSpace($expected)) { throw "published sidecar is empty/unparseable" }
              $actual = (Get-FileHash -Path veyyon-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $expected) { throw "checksum mismatch: expected $expected, got $actual" }
              Write-Host "checksum verified: $actual"
         - name: Launch the published windows-x64 binary (forces native-addon load)
           shell: pwsh
           run: |
              $runtimeDir = Join-Path $env:TEMP "veyyon-verify-$PID"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              # Assert the reported version matches the release tag (catches a binary
              # built from the wrong commit / a failed version-embed).
              $expected = "veyyon/" + ("${{ needs.release_metadata.outputs.release-tag }}" -replace '^v','')
              $actual = (& .\veyyon-windows-x64.exe --version | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "veyyon-windows-x64.exe --version failed with exit $LASTEXITCODE" }
              Write-Host "reported: $actual (expected to contain: $expected)"
              if ($actual -notlike "*$expected*") { throw "published Windows binary reports '$actual', expected '$expected'" }
              & .\veyyon-windows-x64.exe --smoke-test
              if ($LASTEXITCODE -ne 0) { throw "veyyon-windows-x64.exe --smoke-test failed with exit $LASTEXITCODE" }


   release_github_publish:
      name: Publish verified GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' &&
         needs.release_site.result == 'success' &&
         needs.release_github_verify.result == 'success' &&
         needs.release_github_verify_linux.result == 'success' &&
         needs.release_github_verify_windows.result == 'success' }}
      needs: [release_metadata, release_github, release_site, release_github_verify, release_github_verify_linux, release_github_verify_windows]
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      permissions:
         actions: read
         contents: write
      steps:
         - name: Download the verified asset digest manifest
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: veyyon-release-proof-${{ needs.release_metadata.outputs.release-tag }}
              path: release-proof
         - name: Publish the exact verified draft
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
              RELEASE_SHA: ${{ github.sha }}
              RELEASE_ID: ${{ needs.release_github.outputs.release-id }}
              ALREADY_PUBLISHED: ${{ needs.release_github.outputs.already-published }}
           shell: bash
           run: |
              set -euo pipefail
              remote_dir="$(mktemp -d)"
              remote_assets="$(mktemp)"
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
                --jq '.[] | [.id, .name] | @tsv' > "$remote_assets"
              if [ ! -s "$remote_assets" ]; then
                echo "::error::verified release $RELEASE_ID has no downloadable assets"
                exit 1
              fi
              while IFS=$'\t' read -r asset_id name; do
                case "$name" in
                  ""|"."|".."|*/*)
                    echo "::error::release asset has unsafe name '$name'"
                    exit 1
                    ;;
                esac
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  -H "Accept: application/octet-stream" > "$remote_dir/$name"
              done < "$remote_assets"
              (
                cd "$remote_dir"
                for asset in *; do
                  digest="$(sha256sum "$asset")"
                  printf '%s  %s\n' "${digest%% *}" "$asset"
                done | LC_ALL=C sort -k2
              ) > remote-assets.sha256
              if ! diff -u release-proof/local-assets.sha256 remote-assets.sha256; then
                echo "::error::draft release assets changed after verification; refusing publication"
                exit 1
              fi
              release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
              ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
              actual_id="$(jq -r '.id' <<<"$release_json")"
              actual_tag="$(jq -r '.tag_name' <<<"$release_json")"
              ref_type="$(jq -r '.object.type' <<<"$ref_json")"
              ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
              is_draft="$(jq -r '.draft' <<<"$release_json")"
              if [ "$actual_id" != "$RELEASE_ID" ] || [ "$actual_tag" != "$RELEASE_TAG" ] ||
                 [ "$ref_type" != commit ] || [ "$ref_sha" != "$RELEASE_SHA" ]; then
                echo "::error::release identity changed after verification; refusing publication"
                exit 1
              fi
              if [ "$ALREADY_PUBLISHED" = true ]; then
                if [ "$is_draft" != false ]; then
                  echo "::error::release changed back to draft after byte comparison"
                  exit 1
                fi
                echo "Published release $RELEASE_TAG was already byte-identical; publication is unchanged."
              else
                if [ "$is_draft" != true ]; then
                  echo "::error::verified release $RELEASE_ID is no longer a draft"
                  exit 1
                fi
                published="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)"
                if [ "$(jq -r '.id' <<<"$published")" != "$RELEASE_ID" ] ||
                   [ "$(jq -r '.draft' <<<"$published")" != false ]; then
                  echo "::error::GitHub did not publish the verified draft $RELEASE_ID"
                  exit 1
                fi
                echo "Published verified draft $RELEASE_ID as $RELEASE_TAG."
              fi

              # Fresh publication and byte-identical retries converge here. The
              # installers and self-updater resolve releases/latest, so API state
              # alone is not delivery proof: wait until that public selector names
              # this exact tag before the site and installer gates can continue.
              latest_ok=false
              for attempt in $(seq 1 30); do
                proof="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
                effective="$(curl -fsSL --connect-timeout 10 --max-time 30 \
                  -H 'Cache-Control: no-cache' -o /dev/null -w '%{url_effective}' \
                  "https://github.com/$GITHUB_REPOSITORY/releases/latest?veyyon-proof=$proof" || true)"
                effective_without_query="${effective%%\?*}"
                if [ "$effective_without_query" = "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" ]; then
                  latest_ok=true
                  echo "Public releases/latest resolves to $RELEASE_TAG."
                  break
                fi
                echo "releases/latest attempt $attempt resolved to '${effective:-<request failed>}'; waiting for $RELEASE_TAG"
                sleep 10
              done
              if [ "$latest_ok" != true ]; then
                echo "::error::public releases/latest did not resolve to $RELEASE_TAG within 5 minutes"
                exit 1
              fi


   release_site_finalize:
      # The pre-publication deploy proves the Pages projects and installer bytes
      # before the draft becomes visible. Rebuild after publication so the
      # changelog generator can replace the pending draft card with the immutable
      # GitHub release link and latest marker.
      name: Finalize published website
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github_publish.result == 'success' }}
      needs: [release_metadata, release_github_publish]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      concurrency:
         group: production-site-deploy
         cancel-in-progress: false
      permissions:
         contents: read
      env:
         HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
         HAS_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
         SITE_AUTODEPLOY: ${{ vars.SITE_AUTODEPLOY }}
      steps:
         - name: Require release Pages deployment credentials and policy
           run: |
              set -euo pipefail
              if [ "$SITE_AUTODEPLOY" = "off" ]; then
                echo "::error::SITE_AUTODEPLOY=off, but production site deployment is a required release artifact."
                exit 1
              fi
              if [ "$HAS_CF_TOKEN" != "true" ] || [ "$HAS_CF_ACCOUNT_ID" != "true" ]; then
                echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are both required for a release."
                exit 1
              fi
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Rebuild changelog after GitHub publication
           run: node website/build.mjs
         - name: Deploy finalized changelog to veyyon.dev
           env:
              CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
           run: node website/deploy.mjs --skip-build
         - name: Verify veyyon.dev links the published release
           run: bun scripts/verify-deployed-changelog.ts ${{ needs.release_metadata.outputs.release-tag }}

   release_install_verify:
      # The half of installer verification that cannot be moved earlier, and the
      # only half left here.
      #
      # Everything the installer does AROUND the binary is already proven before
      # publication and gates it: `install_methods` and `install_ps1_e2e` drive
      # the real installers with `--local`, and `release_github_verify`,
      # `release_github_verify_linux` and `release_github_verify_windows`
      # download each DRAFT asset, verify its `.sha256` the way the installers do
      # and launch the binary. `release_github_publish` refuses to publish unless
      # all of those are green, so a broken binary or a bad sidecar never reaches
      # a user.
      #
      # What is left is how the binary GETS there: `resolve_latest_tag` follows
      # `github.com/<repo>/releases/latest`, and that redirect resolves only to a
      # non-draft release. There is no ref that names the draft, so this path is
      # unreachable until the release is public. It runs here because it cannot
      # run anywhere else, not because it was convenient.
      #
      # Which means a failure below is a failure on a release users can already
      # download, so it is reported as one: see the rollback step at the end.
      name: "Verify published install (${{ matrix.name }})"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github_publish.result == 'success' &&
         needs.release_site_finalize.result == 'success' }}
      needs: [release_metadata, release_github_publish, release_site_finalize]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { name: linux-x64, os: ubuntu-22.04, kind: posix }
               - { name: linux-arm64, os: ubuntu-24.04-arm, kind: posix }
               - { name: macos-arm64, os: macos-14, kind: posix }
               - { name: macos-x64, os: macos-15-intel, kind: posix }
               - { name: windows-x64, os: windows-latest, kind: windows }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Install through the published POSIX release
           if: matrix.kind == 'posix'
           shell: bash
           env:
              VEYYON_EXPECTED_RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: bash scripts/install-tests/published-release-e2e.sh
         - name: Install through the published Windows release
           if: matrix.kind == 'windows'
           shell: pwsh
           env:
              VEYYON_INSTALL_E2E: "1"
              VEYYON_EXPECTED_RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
           run: pwsh -File scripts/install-tests/e2e.test.ps1 -Mode Binary
         # This job is the one release gate whose subject is already public, so a
         # red run here is not "the release did not ship". It is "the release
         # shipped and the documented install path is broken on it", and every
         # `curl -fsSL https://get.veyyon.dev | sh` and self-update is resolving
         # it right now. Nothing above can undo that, so the only useful thing
         # left is to say so and name the lever.
         - name: Report that the broken release is already public
           if: failure()
           shell: bash
           env:
              RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag }}
              PLATFORM: ${{ matrix.name }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
           run: |
              set -euo pipefail
              echo "::error title=Published release $RELEASE_TAG fails to install on $PLATFORM::this release is ALREADY PUBLIC and releases/latest resolves to it; demote it before investigating"
              {
                echo "## $RELEASE_TAG is public and does not install on $PLATFORM"
                echo
                echo "This ran after publication because it has to: the installer resolves"
                echo "\`releases/latest\`, and that redirect never names a draft. So the release users"
                echo "get is this one, and it is broken on \`$PLATFORM\`."
                echo
                echo "Roll back FIRST, investigate after. Do not delete the tag."
                echo
                echo "1. Open \`$RELEASE_TAG\` in the releases UI and uncheck **Set as the latest"
                echo "   release**, or mark it a pre-release. GitHub recomputes \`latest\` as the most"
                echo "   recent stable release below it."
                echo "2. Confirm what \`latest\` now names:"
                echo
                echo "   \`\`\`sh"
                echo "   gh release view --json tagName -q .tagName"
                echo "   \`\`\`"
                echo
                echo "3. Re-test the install on a clean machine; it should fetch the previous version."
                echo
                echo "Full procedure: \`docs/internal/releasing.md\`, \"The release is bad and users are"
                echo "installing it\"."
                echo
                echo "Run: $RUN_URL"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

   release_train_alert:
      # Eight consecutive releases (v1.0.28-v1.0.35) were tagged and then died red
      # with zero signal anywhere; the jam was only found by manual audit. This is
      # the failure that makes that impossible: whenever a required release job
      # fails, is cancelled, or is skipped, it files (or updates) ONE pinned
      # issue labeled `release-train`; only a run where every required artifact
      # succeeded may close it. `always()` is required for incomplete upstreams.
      #
      # The gate is the tag ref, NOT `release_metadata`'s verdict. Keying this job
      # off `needs.release_metadata.result == 'success'` made the monitor go quiet
      # in one of the cases it exists to catch: v1.0.39 (run 30699220856) died
      # inside `Resolve release metadata` itself, so this job was SKIPPED and the
      # tag stranded with no release object and no report at all. Whether a run is
      # a release attempt is knowable from the `github` context alone, and unlike
      # an upstream job result it cannot be taken out by an upstream crash, so the
      # alert now survives every upstream shape including a dead first job.
      name: Release train alert
      if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
      # Every job on the release path, so the alert names the ROOT cause instead
      # of the first casualty. `native_artifact_lookup` is here because its
      # failure skips `release_binary` and nothing publishes; watching only the
      # casualty would report "release_binary skipped" with no cause attached.
      # scripts/release-train-alert-watches-the-train.test.ts derives this set
      # from the needs graph and fails when a new release job is not added here.
      needs: [release_metadata, native_artifact_lookup, check, native_linux_x64, native_cross_platform_cross, native_cross_platform_macos, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_buckets, test_smoke, install_methods, install_ps1_e2e, install_ps1_functions, release_binary, release_github, release_site, release_github_verify, release_github_verify_linux, release_github_verify_windows, release_github_publish, release_site_finalize, release_install_verify]
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         contents: read
         issues: write
      env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         NEEDS_JSON: ${{ toJSON(needs) }}
         # `release-tag` is empty whenever release_metadata never got far enough to
         # emit it, which is exactly the v1.0.39 shape this job now has to report.
         # On a `refs/tags/v*` run the ref itself names the tag.
         RELEASE_TAG: ${{ needs.release_metadata.outputs.release-tag || github.ref_name }}
         RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      steps:
         - name: File or clear the pinned release-train issue
           shell: bash
           run: |
              set -euo pipefail

              # A monitor that cannot deliver must never be mistaken for the thing
              # it monitors. "Reported a red train" and "could not report at all"
              # both surface as `Release train alert -> failure` in the run list,
              # so the two are separated here by annotation title, job summary and
              # exit code: 1 means the release train is red, 2 means this alert is
              # broken and the state of the release is UNKNOWN rather than green.
              # Every call that can fail routes here instead of letting `set -e`
              # kill the step with no attribution.
              alert_broken() {
                echo "::error title=Release train alert is BROKEN::the alert could not $1, so the release-train state of $RELEASE_TAG is UNKNOWN and was never reported"
                {
                  echo "## Release train alert is BROKEN"
                  echo
                  echo "This job is the monitor, and the monitor is what failed. It could not **$1**."
                  echo
                  echo "Nothing here is a verdict on \`$RELEASE_TAG\`. Its release-train state is"
                  echo "UNKNOWN, NOT green, and has to be checked by hand."
                  echo
                  echo "Run: $RUN_URL"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                exit 2
              }

              # `failure` and `cancelled` are root causes. `skipped` is collateral
              # from an upstream that already died, but a skipped release job still
              # means the tag did not ship, so both keep the train red. Separating
              # them keeps the root cause readable: v1.0.45 reported three job
              # names when only `release_github_publish` had actually failed.
              broken=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' | paste -sd',' -) \
                || alert_broken "classify the upstream job results"
              stranded=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "skipped") | .key' | paste -sd',' -) \
                || alert_broken "classify the upstream job results"

              # Publish the verdict to the run page BEFORE touching the network, so
              # an unreachable issue API costs the delivery but never the finding.
              if [ -n "$broken" ] || [ -n "$stranded" ]; then
                {
                  echo "## Release train RED: $RELEASE_TAG"
                  echo
                  echo "| result | jobs |"
                  echo "| --- | --- |"
                  echo "| failed or cancelled | \`${broken:-none}\` |"
                  echo "| skipped as a result | \`${stranded:-none}\` |"
                  echo
                  echo "Run: $RUN_URL"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              else
                {
                  echo "## Release train green: $RELEASE_TAG"
                  echo
                  echo "Every watched release job succeeded."
                  echo
                  echo "Run: $RUN_URL"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi

              # Self-heal the label: `gh issue create --label` hard-fails when the
              # label does not exist (killed the cut alert on 2026-07-24).
              gh label create release-train --repo "$GITHUB_REPOSITORY" \
                --description "Pinned release-train status issue" --color D93F0B --force \
                || alert_broken "create or refresh the \`release-train\` label"
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-train --state open --json number --jq '.[0].number // empty') \
                || alert_broken "list the open \`release-train\` issues"

              if [ -n "$broken" ] || [ -n "$stranded" ]; then
                title="Release train red: $RELEASE_TAG stalled in ${broken:-skipped release jobs}"
                body=$(printf 'Release run for `%s` did not ship.\n\nFailed or cancelled: `%s`\nSkipped as a result: `%s`\n\nRun: %s\n\nPublishing stays jammed until a green release run closes this issue automatically.' \
                  "$RELEASE_TAG" "${broken:-none}" "${stranded:-none}" "$RUN_URL")
                if [ -n "$existing" ]; then
                  gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" \
                    || alert_broken "comment the $RELEASE_TAG report onto release-train issue #$existing"
                  gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" \
                    || alert_broken "retitle release-train issue #$existing"
                else
                  gh issue create --repo "$GITHUB_REPOSITORY" --label release-train --title "$title" --body "$body" \
                    || alert_broken "open a new release-train issue"
                fi
                echo "::error title=Release train is RED::$RELEASE_TAG stalled in ${broken:-skipped release jobs} (release-train issue updated)"
                exit 1
              fi

              if [ -n "$existing" ]; then
                gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Green release run for \`$RELEASE_TAG\` published: $RUN_URL" \
                  || alert_broken "close release-train issue #$existing"
              fi
              echo "release train green for $RELEASE_TAG"
