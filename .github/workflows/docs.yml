# Docs link gate: fails on dead internal markdown links/anchors anywhere in the
# tracked tree (handbook, flat docs, internal docs, READMEs). Complements
# checks.yml, whose push trigger deliberately ignores docs/** and *.md.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/check-doc-links.ts"
      - "scripts/check-doc-freshness.ts"
      - "scripts/check-doc-imports.ts"
      - "scripts/check-doc-paths.ts"
      - "scripts/gen-example-js.ts"
      - "scripts/gen-settings-reference.ts"
      # The checkers' own self-tests run in this job and none of them was listed,
      # so editing a checker's test never ran the gate that runs it: a change to
      # what a gate asserts landed on main with the gate itself never firing.
      - "scripts/check-doc-links.test.ts"
      - "scripts/check-doc-freshness.test.ts"
      - "scripts/check-doc-imports.test.ts"
      - "scripts/check-doc-paths.test.ts"
      - "scripts/gen-example-js.test.ts"
      - "scripts/docs-book-pin.test.ts"
      - "scripts/handbook-built-pages-contain-source-contracts.test.ts"
      - "scripts/gen-settings-reference.test.ts"
      - "scripts/settings-doc-coherence.test.ts"
      - "packages/*/examples/**"
      - "packages/coding-agent/tsconfig.examples.json"
      # Adding a package is what makes the package maps stale, and a new manifest
      # matches none of the filters above, so the run that would catch it would
      # not have started.
      - "packages/*/package.json"
      - "scripts/package-map-coverage.test.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/check-doc-links.ts"
      - "scripts/check-doc-freshness.ts"
      - "scripts/check-doc-imports.ts"
      - "scripts/check-doc-paths.ts"
      - "scripts/gen-example-js.ts"
      - "scripts/gen-settings-reference.ts"
      # The checkers' own self-tests run in this job and none of them was listed,
      # so editing a checker's test never ran the gate that runs it: a change to
      # what a gate asserts landed on main with the gate itself never firing.
      - "scripts/check-doc-links.test.ts"
      - "scripts/check-doc-freshness.test.ts"
      - "scripts/check-doc-imports.test.ts"
      - "scripts/check-doc-paths.test.ts"
      - "scripts/gen-example-js.test.ts"
      - "scripts/docs-book-pin.test.ts"
      - "scripts/handbook-built-pages-contain-source-contracts.test.ts"
      - "scripts/gen-settings-reference.test.ts"
      - "scripts/settings-doc-coherence.test.ts"
      - "packages/*/examples/**"
      - "packages/coding-agent/tsconfig.examples.json"
      # Adding a package is what makes the package maps stale, and a new manifest
      # matches none of the filters above, so the run that would catch it would
      # not have started.
      - "packages/*/package.json"
      - "scripts/package-map-coverage.test.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Release shas keep their docs gates: byte-equivalent copy of ci.yml's
# release-detection concurrency (see checks.yml/ci.yml comments; keep in lockstep).
concurrency:
  group: "docs-${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.sha) || (github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.ref) }}"
  cancel-in-progress: "${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}"

permissions:
  contents: read

jobs:
  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the freshness gate resolves each doc's verification-stamp
      # commit (`git cat-file -e <sha>`) and its last-edit date (`git log`). A
      # shallow (depth-1) checkout has only the tip commit, so every stamp sha
      # reads as "does not exist" and every doc looks edited at the tip date.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # The shared composite: bun on PATH, a cached `bun install
      # --frozen-lockfile` with the corrupt-store retry, and the gitignored
      # source codegen. This job needs all three. The doc checkers are not
      # dependency-free (`gen-settings-reference` renders from the real settings
      # schema, `gen-example-js` transpiles through tsgo), and `check-doc-imports`
      # resolves a documented `import { X } from "@veyyon/..."` by importing the
      # package, which statically pulls in the gitignored
      # src/export/html/tool-views.generated.js.
      - uses: ./.github/actions/bun-install
      - name: Build the test sandbox image
        # Every `bun test` in this repo refuses to run unless it can prove the
        # operator's home is unreachable, so CI has to establish the same
        # boundary a workstation does. Without this the two suites below exit 1
        # on the refusal before running a single assertion, which is how this
        # job went red the moment the gate landed.
        run: bash scripts/test-sandbox/run.sh --build
      - name: Checker self-tests
        run: bash scripts/test-sandbox/run.sh bun test scripts/check-doc-links.test.ts scripts/check-doc-freshness.test.ts scripts/check-doc-imports.test.ts scripts/check-doc-paths.test.ts scripts/gen-example-js.test.ts scripts/docs-book-pin.test.ts scripts/gen-settings-reference.test.ts scripts/settings-doc-coherence.test.ts
      # The two package maps (ARCHITECTURE.md, AGENTS.md) must describe every package
      # and no package that is gone. Adding a package is what makes them stale, and
      # nothing about adding one prompts anybody to open a markdown table.
      - name: Check the package maps cover every package
        run: bash scripts/test-sandbox/run.sh bun test scripts/package-map-coverage.test.ts
      - name: Check internal markdown links
        run: bun scripts/check-doc-links.ts
      - name: Check internal doc verification stamps
        run: bun scripts/check-doc-freshness.ts
      # Documented imports must resolve. A rename that lands in the code and the
      # CHANGELOG but not in the READMEs leaves a package's quick start throwing
      # on its first line, and no other gate reads inside a fenced code block.
      - name: Check documented imports exist
        run: bun scripts/check-doc-imports.ts
      # Docs name source files far more often in a bare code span than in a
      # markdown link, and check-doc-links strips code spans on purpose. That gap
      # let `prompt-blocks.ts` keep its three mentions after the file was split,
      # including the line telling a contributor which file to edit.
      - name: Check documented source paths exist
        run: bun scripts/check-doc-paths.ts
      # The settings reference is rendered from the schema. A settings change that
      # does not regenerate it leaves the documented default or description wrong,
      # so the stale file fails here rather than shipping.
      - name: Check the generated settings reference is current
        run: bun scripts/gen-settings-reference.ts
      # Every example ships twice, `hello.ts` beside `hello.js`, so a reader
      # working in plain JavaScript can copy one. The `.js` is transpiled from the
      # `.ts`; when both were hand-maintained, five drifted and two of them
      # reproduced type errors already fixed in the TypeScript copy.
      - name: Check the generated example twins are current
        run: bun scripts/gen-example-js.ts

  doc-examples:
    # Asserts every documented command/flag/mcp-block/keybinding/env-var/slash-command/
    # tool/settings-key against the REAL CLI + schema. checks.yml runs this test on code
    # changes but path-ignores docs/**, so without this job a doc-only change that adds a
    # phantom command or setting would ship uncaught.
    name: Docs vs code truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Same composite as link-check: install plus the gitignored
      # tool-views.generated.js, which the HTML-export entrypoint this suite
      # imports resolves at parse time.
      - uses: ./.github/actions/bun-install
      - name: Build the test sandbox image
        # Same refusal as the link-check job above: the gate is unconditional,
        # so this suite needs the boundary built before it can run.
        run: bash scripts/test-sandbox/run.sh --build
      - name: Docs examples match the real CLI
        run: bash scripts/test-sandbox/run.sh bun test packages/coding-agent/test/docs-examples.test.ts

  book-staleness:
    # The rendered handbook (docs/handbook/book) is a gitignored build artifact.
    # This job builds the handbook with pinned mdbook v0.5.2, verifies search
    # assets and links, and checks source contracts against the generated HTML.
    name: Handbook build and asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - name: Build the test sandbox image
        run: bash scripts/test-sandbox/run.sh --build
      - name: Install mdbook
        # Explicit Bash enables pipefail so tar cannot mask a failed download.
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build handbook
        run: mdbook build docs/handbook
      - name: Verify handbook assets and search index
        shell: bash
        run: |
          book="docs/handbook/book"
          if [ ! -f "$book/index.html" ]; then
            echo "::error::mdbook v0.5.2 build failed to generate docs/handbook/book/index.html"
            exit 1
          fi
          refs=$(mktemp "$book/asset-refs.XXXXXX")
          grep -ohE '"[^"]*-[0-9a-f]{8}\.(js|css)"' "$book"/*.html "$book"/**/*.html 2>/dev/null | tr -d '"' | sort -u >"$refs" || true
          absent=""
          while read -r asset; do
            [ -z "$asset" ] && continue
            base="${asset##*/}"
            if [ ! -e "$book/$asset" ] && [ ! -e "$book/$base" ]; then
              absent="$absent $asset"
            fi
          done <"$refs"
          rm -f "$refs"
          if [ -n "$absent" ]; then
            echo "::error::Generated handbook (mdbook v0.5.2) references missing assets:$absent"
            exit 1
          fi
      - name: Check handbook built pages contain source contracts
        run: bash scripts/test-sandbox/run.sh bun test scripts/handbook-built-pages-contain-source-contracts.test.ts
      - name: Verify generated book is gitignored
        run: |
          if ! git check-ignore -q docs/handbook/book; then
            echo "::error::docs/handbook/book is not ignored by .gitignore"
            exit 1
          fi
