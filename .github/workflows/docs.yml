# Docs link gate: fails on dead internal markdown links/anchors anywhere in the
# tracked tree (handbook, flat docs, internal docs, READMEs). Complements
# checks.yml, whose push trigger deliberately ignores docs/** and *.md.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/check-doc-links.ts"
      - "scripts/check-doc-freshness.ts"
      - "scripts/check-doc-imports.ts"
      - "scripts/check-doc-paths.ts"
      - "scripts/gen-example-js.ts"
      - "packages/*/examples/**"
      - "packages/coding-agent/tsconfig.examples.json"
      # Adding a package is what makes the package maps stale, and a new manifest
      # matches none of the filters above, so the run that would catch it would
      # not have started.
      - "packages/*/package.json"
      - "scripts/package-map-coverage.test.ts"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "scripts/check-doc-links.ts"
      - "scripts/check-doc-freshness.ts"
      - "scripts/check-doc-imports.ts"
      - "scripts/check-doc-paths.ts"
      - "scripts/gen-example-js.ts"
      - "packages/*/examples/**"
      - "packages/coding-agent/tsconfig.examples.json"
      # Adding a package is what makes the package maps stale, and a new manifest
      # matches none of the filters above, so the run that would catch it would
      # not have started.
      - "packages/*/package.json"
      - "scripts/package-map-coverage.test.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Release shas keep their docs gates: byte-equivalent copy of ci.yml's
# release-detection concurrency (see checks.yml/ci.yml comments; keep in lockstep).
concurrency:
  group: "docs-${{ (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
  cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}"

permissions:
  contents: read

jobs:
  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      # Full history: the freshness gate resolves each doc's verification-stamp
      # commit (`git cat-file -e <sha>`) and its last-edit date (`git log`). A
      # shallow (depth-1) checkout has only the tip commit, so every stamp sha
      # reads as "does not exist" and every doc looks edited at the tip date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The doc checkers are not all dependency-free, and the job used to have no
      # install step at all. `gen-settings-reference` renders from the real
      # settings schema, `check-doc-imports` loads the logger to resolve what the
      # READMEs import, and `gen-example-js` transpiles through tsgo — so four of
      # the eight self-tests below died on a missing module, bun reached the npm
      # registry for a `tsgo` package that does not exist there, and the whole job
      # was red for a reason that had nothing to do with the docs it checks.
      - run: bun install --frozen-lockfile
      # `check-doc-imports` verifies a documented `import { X } from "@veyyon/..."`
      # by actually importing the package and reading its exports, and importing
      # `@veyyon/coding-agent` statically pulls in the gitignored build artifact
      # src/export/html/tool-views.generated.js. Without it the import throws, the
      # checker reports "cannot load" for every documented SDK symbol, and the
      # failure names the docs rather than the missing artifact. The doc-examples
      # job below generates it for the same reason.
      - name: Generate tool views
        run: bun --cwd=packages/coding-agent run gen:tool-views
      - name: Checker self-tests
        run: bun test scripts/check-doc-links.test.ts scripts/check-doc-freshness.test.ts scripts/check-doc-imports.test.ts scripts/check-doc-paths.test.ts scripts/gen-example-js.test.ts scripts/docs-book-pin.test.ts scripts/gen-settings-reference.test.ts scripts/settings-doc-coherence.test.ts
      # The two package maps (ARCHITECTURE.md, AGENTS.md) must describe every package
      # and no package that is gone. Adding a package is what makes them stale, and
      # nothing about adding one prompts anybody to open a markdown table.
      - name: Check the package maps cover every package
        run: bun test scripts/package-map-coverage.test.ts
      - name: Check internal markdown links
        run: bun scripts/check-doc-links.ts
      - name: Check internal doc verification stamps
        run: bun scripts/check-doc-freshness.ts
      # Documented imports must resolve. A rename that lands in the code and the
      # CHANGELOG but not in the READMEs leaves a package's quick start throwing
      # on its first line, and no other gate reads inside a fenced code block.
      - name: Check documented imports exist
        run: bun scripts/check-doc-imports.ts
      # Docs name source files far more often in a bare code span than in a
      # markdown link, and check-doc-links strips code spans on purpose. That gap
      # let `prompt-blocks.ts` keep its three mentions after the file was split,
      # including the line telling a contributor which file to edit.
      - name: Check documented source paths exist
        run: bun scripts/check-doc-paths.ts
      # The settings reference is rendered from the schema. A settings change that
      # does not regenerate it leaves the documented default or description wrong,
      # so the stale file fails here rather than shipping.
      - name: Check the generated settings reference is current
        run: bun scripts/gen-settings-reference.ts
      # Every example ships twice, `hello.ts` beside `hello.js`, so a reader
      # working in plain JavaScript can copy one. The `.js` is transpiled from the
      # `.ts`; when both were hand-maintained, five drifted and two of them
      # reproduced type errors already fixed in the TypeScript copy.
      - name: Check the generated example twins are current
        run: bun scripts/gen-example-js.ts

  doc-examples:
    # Asserts every documented command/flag/mcp-block/keybinding/env-var/slash-command/
    # tool/settings-key against the REAL CLI + schema. checks.yml runs this test on code
    # changes but path-ignores docs/**, so without this job a doc-only change that adds a
    # phantom command or setting would ship uncaught.
    name: Docs vs code truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install workspace
        run: bun install --frozen-lockfile
      # docs-examples imports the HTML-export entrypoint, which statically pulls
      # in the gitignored build artifact src/export/html/tool-views.generated.js.
      # A fresh checkout does not have it, so generate it (the binary build does
      # the same) before the test can load that module.
      - name: Generate tool views
        run: bun --cwd=packages/coding-agent run gen:tool-views
      - name: Docs examples match the real CLI
        run: bun test packages/coding-agent/test/docs-examples.test.ts

  book-staleness:
    # The rendered handbook (docs/handbook/book) is committed because the
    # website deploy serves it via the website/docs symlink. Committed build
    # output goes stale silently; this job fails when the committed book does
    # not match a fresh `mdbook build` of docs/handbook/src at the pinned
    # mdbook version (keep the pin in sync with the version contributors use).
    name: Handbook book freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Rebuild handbook
        run: mdbook build docs/handbook
      - name: Committed book matches sources
        run: |
          if ! git diff --exit-code --stat -- docs/handbook/book; then
            echo "::error::docs/handbook/book is stale — run 'mdbook build' in docs/handbook (mdbook v0.5.2) and commit the result."
            exit 1
          fi
