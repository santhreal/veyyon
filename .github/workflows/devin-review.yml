# Request the AI review on every pull request, so no pull request waits on somebody
# remembering to ask for one.
#
# The review used to be requested by hand: a maintainer commented `/devin review` on the
# pull request. That made the review optional in practice — the pull requests that got one
# were the ones somebody was already reading, which are the ones least likely to need it.
# This workflow posts the request itself, once per pull request, and the findings arrive as
# inline review comments on the pull request the way they always did.
#
# `pull_request_target` and not `pull_request`: the token a `pull_request` run receives for
# a fork is read-only, so the comment cannot be posted at all. `pull_request_target` runs
# in the base repository's context with a writable token, which is only safe because this
# workflow NEVER checks out the pull request's code and runs nothing from it. It reads two
# numbers from the event payload and calls the REST API. Do not add a checkout step here.
#
# Requested once. Devin re-reviews a pull request when new commits land, so a request per
# push would be a second review of the same head and a notification for every force-push.
# `opened` covers a pull request that starts ready, `ready_for_review` a draft that becomes
# one, and `reopened` a pull request that was closed and picked up again — and the marker
# below makes all three idempotent, because a draft that opens and then becomes ready fires
# twice.
name: Devin review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

concurrency:
  # Per pull request, and NOT cancel-in-progress: the two events a draft fires arrive
  # seconds apart, and cancelling the first would drop a request the second then skips
  # because the marker it looks for was never written.
  group: "devin-review-${{ github.event.pull_request.number }}"
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    name: Ask for a review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the review once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` has no checkout to read the repository from, so it is named here rather
          # than left for git to answer. Every call below writes `{owner}/{repo}`, which
          # gh fills in from this.
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # A draft is not ready to be read. It gets its request from the
          # `ready_for_review` event instead, which is the point at which the author says
          # the diff is the diff.
          if [ "${DRAFT}" = "true" ]; then
            echo "pull request ${NUMBER} is a draft; the request waits for ready_for_review"
            exit 0
          fi
          # The marker, not the command, is what makes this idempotent: the comment body
          # carries an HTML comment nothing renders, so a second run finds its own earlier
          # request instead of posting a duplicate that spends another review. jq does the
          # matching, so this composes no pipeline and cannot report a dead left-hand side.
          marker='<!-- devin-review-requested -->'
          existing=$(gh api "repos/{owner}/{repo}/issues/${NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | join(\",\")")
          if [ -n "${existing//,/}" ]; then
            echo "pull request ${NUMBER} already carries a review request"
            exit 0
          fi
          gh api "repos/{owner}/{repo}/issues/${NUMBER}/comments" -f "body=/devin review
          ${marker}" >/dev/null
          echo "requested a review on pull request ${NUMBER}"
