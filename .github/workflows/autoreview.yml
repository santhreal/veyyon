# santh-bot autoreview: qodo-ai/pr-agent runs an AI review, description, and
# improvement pass on every PR — the same standard as the Santh monorepo's
# qodo-review workflow. Gated on the QODO_API_KEY repo secret: when it is
# absent the workflow logs a loud warning and skips rather than failing red,
# so forks and secret-less environments stay green without a silent no-op.
name: Autoreview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Nothing at workflow level. Every job starts with no token scope at all and
# names what it needs, so a job added later cannot silently inherit write on
# pull requests. Only `review` touches the API.
permissions: {}

concurrency:
  group: "autoreview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  preflight:
    name: Check autoreview credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads a secret into a step output and writes nothing to the API.
    permissions: {}
    # Draft PRs get no review until marked ready; syncs on a draft are skipped.
    if: github.event.pull_request.draft == false
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Detect QODO_API_KEY
        id: check
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
        run: |
          if [ -n "$QODO_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "QODO_API_KEY present — santh-bot autoreview will run."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=santh-bot autoreview skipped::QODO_API_KEY repo secret is not set. Add it (Settings → Secrets → Actions) to enable the AI review/describe/improve pass."
          fi

  review:
    name: santh-bot review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    if: needs.preflight.outputs.has_key == 'true'
    # pr-agent reads the diff and the repo's own config, then writes the review
    # comment, the description and the suggestions back onto the pull request.
    # `issues: write` is deliberately absent: every write here targets a pull
    # request, and the issue-comments endpoint accepts pull-requests write for a
    # PR number, so the issues scope was never reached.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: PR Agent review
        # An immutable release tag, not a branch tip. The previous pin was the
        # commit main happened to be at, so the trailing comment named a moving
        # branch and no one could tell which behaviour was pinned. v0.40.0 is
        # the first release containing that commit, and it is 12 commits AHEAD
        # of it, not equal to it: the repin moved behaviour. The one that
        # mattered here is `feat(config): update default model`, which changes
        # which model reviews every PR, so the model is named below rather than
        # left to whatever the action's default happens to be at the next bump.
        uses: qodo-ai/pr-agent@6ad7cf75d95cb3bbb54cf2ad92050eb03804964a # v0.40.0
        env:
          OPENAI_KEY: ${{ secrets.QODO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Pinned, because the action's default moves between releases and a
          # review model is not something a dependency bump should choose.
          config.model: "gpt-5.6"
