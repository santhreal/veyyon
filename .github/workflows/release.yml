# Cut a release in CI, so nothing depends on a maintainer workstation. This
# bumps every version, regenerates lockfiles, finalizes changelogs, runs checks,
# commits, and atomically pushes main plus the tag.
#
# Two triggers, one controller:
#   - workflow_run on a completed main CI or Checks run. The gate queries both
#     product workflows and releases only when each is green for the SHA.
#     Releasing on raw push tagged shas whose tests then failed: v1.0.28
#     through v1.0.35 were each tagged before ci.yml had tested the sha, two red
#     packages/utils tests killed every publish downstream, and `releases/latest`
#     sat at v1.0.27 while the tags marched on. The gate then cuts a `patch`
#     release whenever a publishable package has an `## [Unreleased]` changelog
#     bullet waiting (see scripts/release-policy.ts). It is self-limiting:
#     release.ts empties the Unreleased section when it cuts the release, so the
#     bump commit it pushes is not itself releasable and never loops, and a
#     docs/chore-only merge with no bullet does not release.
#
#     That same self-limiting property strands work when a cut FAILS: the section
#     is already consumed, so the changelog signal can never ask for it again, and
#     the tag sits with no published release. So the gate has a second signal —
#     an unpublished tag whose CI definitively failed, with main moved on since —
#     bounded so it cannot inflate versions: two stranded tags stop it and ask for
#     a person instead of cutting a third.
#   - workflow_dispatch: manual release of an explicit version (major/minor/patch
#     or x.y.z), after proving the same exact-main-SHA CI and Checks gates.
#
# After the atomic bump/tag push, release.ts dispatches and waits for exact-tag
# Checks, then dispatches and waits for tagged CI. `workflow_dispatch` is one of
# GitHub's documented exceptions that still creates a run when called with
# `GITHUB_TOKEN`, so the release needs no personal access token or workstation.
# The controller verifies the final asset manifest, published state, and
# `releases/latest` before this workflow reports success.
name: Release

on:
   workflow_run:
      workflows: [CI, Checks]
      types: [completed]
      branches: [main]
   workflow_dispatch:
      inputs:
         version:
            description: "Version to release: major, minor, patch, or an explicit x.y.z"
            required: true
            default: "patch"
            type: string
         expected_sha:
            description: "Exact origin/main SHA validated by the release operator"
            required: true
            type: string

# Never run two releases at once, and never cancel one in flight: a half-pushed
# release (commit without tag, or a tag with no lockfile bump) is far worse than
# a queued one.
concurrency:
   group: release
   queue: max
   cancel-in-progress: false

permissions:
   contents: read
   actions: read

jobs:
   # Decide whether this event should cut a release, and which version. Both
   # automatic workflow completions and manual dispatches must prove that CI and
   # Checks succeeded for the exact checked-out main SHA. Keeping this separate
   # avoids expensive toolchain setup when there is nothing releasable.
   gate:
      name: Decide release
      runs-on: ubuntu-22.04
      # A failed triggering workflow can never release. The decision script also
      # verifies the other required workflows for this exact SHA.
      if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
      outputs:
         should-release: ${{ steps.decide.outputs.should-release }}
         version: ${{ steps.decide.outputs.version }}
         source-sha: ${{ steps.decide.outputs.source-sha }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"
         - name: Install controller dependencies
           run: bun install --frozen-lockfile
         - name: Decide release
           id: decide
           env:
              GITHUB_EVENT_NAME: ${{ github.event_name }}
              RELEASE_DISPATCH_VERSION: ${{ inputs.version }}
              RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
              RELEASE_HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
              RELEASE_TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              RELEASE_TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
              RELEASE_TRIGGER_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/release.ts workflow-gate

   release:
      name: Run release train
      needs: gate
      if: ${{ needs.gate.outputs.should-release == 'true' }}
      runs-on: ubuntu-22.04
      env:
         RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      permissions:
         contents: write
         actions: write
      steps:

         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.gate.outputs.source-sha }}
              # Full history plus tags: the preflight compares the requested
              # version against `git describe`, which a shallow clone cannot see.
              fetch-depth: 0
              fetch-tags: true

         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"

         # `release.ts` runs `bun run check`, whose `check:rs` half is
         # `cargo fmt --check` + `cargo clippy -D warnings`. Both need the
         # toolchain this repo pins in rust-toolchain.toml, with rustfmt and
         # clippy present: a plain stable/minimal install has neither component
         # and the release would fail in its own preflight. Same action and
         # same pin ci.yml uses.
         - uses: ./.github/actions/ensure-rust-toolchain
           with:
              toolchain: nightly-2026-04-29
              components: rustfmt,clippy


         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Cut, gate, publish, and verify the release
           env:
              VEYYON_RELEASE_IN_CI: "1"
              RELEASE_SOURCE_SHA: ${{ needs.gate.outputs.source-sha }}
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/release.ts workflow-release "$RELEASE_VERSION"

   # The controller can fail before tagged CI exists (preflight or an atomic push
   # race), while correlating either dispatched run, or during final publication
   # verification. File or update the same pinned `release-train` issue here.
   # Tagged CI also reports its own failures, and the next green publication
   # closes the shared issue.
   release_failed_alert:
      name: Alert on failed release train
      needs: [gate, release]
      if: ${{ always() && (needs.gate.result == 'failure' || needs.gate.result == 'cancelled' || needs.release.result == 'failure' || needs.release.result == 'cancelled') }}
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         issues: write
      env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
         GATE_RESULT: ${{ needs.gate.result }}
         RELEASE_RESULT: ${{ needs.release.result }}
      steps:
         - name: File or update the pinned release-train issue
           shell: bash
           run: |
              set -euo pipefail
              title="Release train red (gate=$GATE_RESULT, release=$RELEASE_RESULT)"
              body=$(printf 'The Release controller failed during source gating, the atomic cut, dispatched Checks or CI, or final publication verification (gate=%s, release=%s).\n\nRun: %s\n\nInspect the run before attempting another version. The next successful publish closes this issue automatically.' "$GATE_RESULT" "$RELEASE_RESULT" "$RUN_URL")
              # Self-heal the label: `gh issue create --label` hard-fails when the
              # label does not exist, which killed this alert on 2026-07-24 — a
              # dead alert is the worst failure mode this job can have.
              gh label create release-train --repo "$GITHUB_REPOSITORY" \
                --description "Pinned release-train status issue" --color D93F0B --force
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-train --state open --json number --jq '.[0].number // empty')
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --label release-train --title "$title" --body "$body"
              fi
              echo "::error::release train failed (gate=$GATE_RESULT, release=$RELEASE_RESULT); release-train issue updated"
