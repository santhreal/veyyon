# Cut a release in CI, so nothing depends on a maintainer workstation. This
# bumps every version, regenerates lockfiles, finalizes changelogs, runs checks,
# commits, and atomically pushes main plus the tag.
#
# Two triggers, one job:
#   - workflow_run on a completed main CI or Checks run. The gate queries both
#     product workflows and releases only when each is green for the SHA.
#     Releasing on raw push tagged shas whose tests then failed: v1.0.28
#     through v1.0.35 were each tagged before ci.yml had tested the sha, two red
#     packages/utils tests killed every publish downstream, and `releases/latest`
#     sat at v1.0.27 while the tags marched on. The gate then cuts a `patch`
#     release whenever a publishable package has an `## [Unreleased]` changelog
#     bullet waiting (see scripts/release-gate-decision.ts). It is self-limiting:
#     release.ts empties the Unreleased section when it cuts the release, so the
#     bump commit it pushes is not itself releasable and never loops, and a
#     docs/chore-only merge with no bullet does not release.
#
#     That same self-limiting property strands work when a cut FAILS: the section
#     is already consumed, so the changelog signal can never ask for it again, and
#     the tag sits with no published release. So the gate has a second signal —
#     an unpublished tag whose CI definitively failed, with main moved on since —
#     bounded so it cannot inflate versions: two stranded tags stop it and ask for
#     a person instead of cutting a third.
#   - workflow_dispatch: manual release of an explicit version (major/minor/patch
#     or x.y.z), after proving the same exact-main-SHA CI and Checks gates.
#
# After the atomic bump/tag push, this workflow dispatches `ci.yml` explicitly
# at the new tag. `workflow_dispatch` is one of GitHub's documented exceptions
# that still creates a run when called with `GITHUB_TOKEN`, so the release needs
# no personal access token and no workstation. `ci.yml` owns every downstream
# build, manifest check, GitHub release, and production site deployment.
name: Release

on:
   workflow_run:
      workflows: [CI, Checks]
      types: [completed]
      branches: [main]
   workflow_dispatch:
      inputs:
         version:
            description: "Version to release: major, minor, patch, or an explicit x.y.z"
            required: true
            default: "patch"
            type: string
         expected_sha:
            description: "Exact origin/main SHA validated by the release operator"
            required: true
            type: string

# Never run two releases at once, and never cancel one in flight: a half-pushed
# release (commit without tag, or a tag with no lockfile bump) is far worse than
# a queued one.
concurrency:
   group: release
   cancel-in-progress: false

permissions:
   contents: read
   actions: read

jobs:
   # Decide whether this event should cut a release, and which version. Both
   # automatic workflow completions and manual dispatches must prove that CI and
   # Checks succeeded for the exact checked-out main SHA. Keeping this separate
   # avoids expensive toolchain setup when there is nothing releasable.
   gate:
      name: Decide release
      runs-on: ubuntu-22.04
      # A failed triggering workflow can never release. The decision script also
      # verifies the other required workflows for this exact SHA.
      if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
      outputs:
         should-release: ${{ steps.decide.outputs.should-release }}
         version: ${{ steps.decide.outputs.version }}
         source-sha: ${{ steps.decide.outputs.source-sha }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"
         - id: decide
           env:
              EVENT_NAME: ${{ github.event_name }}
              DISPATCH_VERSION: ${{ inputs.version }}
              EXPECTED_SHA: ${{ inputs.expected_sha }}
              # Only defined for workflow_run events; empty on dispatch.
              HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
              TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              main_head=$(git rev-parse HEAD)
              echo "source-sha=$main_head" >> "$GITHUB_OUTPUT"
              if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$TRIGGER_HEAD_SHA" != "$main_head" ]; then
                echo "green workflow run is for $TRIGGER_HEAD_SHA but main is at $main_head; deferring to the newer exact-SHA gates."
                echo "should-release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # Manual dispatch chooses the version, not the source commit or
              # evidence standard. The operator passes the origin/main SHA it
              # validated locally; fail closed if main advanced while this run
              # was queued instead of silently retargeting the requested version.
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                if [ -z "$EXPECTED_SHA" ]; then
                  echo "::error::manual release requires the exact validated main SHA"
                  exit 1
                fi
                if [ "$EXPECTED_SHA" != "$main_head" ]; then
                  echo "::error::main is at $main_head, but the operator validated $EXPECTED_SHA; dispatch a new release only after validating the new main HEAD"
                  exit 1
                fi
                bun scripts/release-gate-decision.ts --green-only >/dev/null
                echo "manual dispatch: exact-SHA CI and Checks are green for $EXPECTED_SHA; releasing '${DISPATCH_VERSION}'"
                echo "should-release=true" >> "$GITHUB_OUTPUT"
                echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # Never release the release script's own bump commit.
              subject="$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n1)"
              case "$subject" in
                "chore: bump version to "*)
                  echo "head is the release bump commit; not releasing (no loop)."
                  echo "should-release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              case "$HEAD_COMMIT_MESSAGE" in
                *"[skip release]"*)
                  echo "[skip release] marker present; not releasing."
                  echo "should-release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac

              releasable="$(bun scripts/release-gate-decision.ts)"
              if [ "$releasable" = "true" ]; then
                echo "should-release=true" >> "$GITHUB_OUTPUT"
                echo "version=patch" >> "$GITHUB_OUTPUT"
              else
                echo "should-release=false" >> "$GITHUB_OUTPUT"
              fi

   release:
      name: Cut release
      needs: gate
      if: ${{ needs.gate.outputs.should-release == 'true' }}
      runs-on: ubuntu-22.04
      env:
         RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      permissions:
         contents: write
         actions: write
      steps:

         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.gate.outputs.source-sha }}
              # Full history plus tags: the preflight compares the requested
              # version against `git describe`, which a shallow clone cannot see.
              fetch-depth: 0
              fetch-tags: true
         - name: Materialize the gated SHA as main
           env:
              RELEASE_SOURCE_SHA: ${{ needs.gate.outputs.source-sha }}
           run: |
              set -euo pipefail
              checked_out_sha=$(git rev-parse HEAD)
              if [ "$checked_out_sha" != "$RELEASE_SOURCE_SHA" ]; then
                echo "::error::release checkout is $checked_out_sha, expected gated SHA $RELEASE_SOURCE_SHA"
                exit 1
              fi
              git switch -C main "$RELEASE_SOURCE_SHA"


         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"

         # `release.ts` runs `bun run check`, whose `check:rs` half is
         # `cargo fmt --check` + `cargo clippy -D warnings`. Both need the
         # toolchain this repo pins in rust-toolchain.toml, with rustfmt and
         # clippy present: a plain stable/minimal install has neither component
         # and the release would fail in its own preflight. Same action and
         # same pin ci.yml uses.
         - uses: ./.github/actions/ensure-rust-toolchain
           with:
              toolchain: nightly-2026-04-29
              components: rustfmt,clippy


         - name: Install dependencies
           run: bun install --frozen-lockfile

         # The release commit is authored by the workflow, not by whoever
         # clicked run: the commit subject is what ci.yml keys its never-cancel
         # release concurrency group off, and it must be reproducible.
         - name: Configure git identity
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

         - name: Cut the release
           env:
              VEYYON_RELEASE_IN_CI: "1"
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/release.ts "$RELEASE_VERSION"

         # Pushes made with GITHUB_TOKEN do not recursively start ordinary push
         # workflows. workflow_dispatch is the documented exception. Gate the
         # exact bump SHA through Checks, then start publication. The immutable
         # tag avoids a moving-main dispatch race.
         - name: Gate the bump and dispatch the publish pipeline
           id: dispatch
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           shell: bash
           run: |
              set -euo pipefail
              release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1)
              release_sha=$(git rev-parse HEAD)
              if [ -z "$release_tag" ]; then
                echo "::error::release.ts returned without leaving a v* tag at HEAD"
                exit 1
              fi

              dispatch_and_wait() {
                workflow="$1"
                label="$2"
                nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${workflow%.yml}"
                expected_title="$label release gate $nonce"
                runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$release_sha&event=workflow_dispatch&per_page=100"
                baseline_ids=$(gh api "$runs_url" --paginate --jq '.workflow_runs[].id')

                gh workflow run "$workflow" --ref "$release_tag" -f release_nonce="$nonce"
                run_id=""
                for attempt in $(seq 1 30); do
                  candidate_ids=$(gh api "$runs_url" --paginate --jq '.workflow_runs[].id')
                  for candidate_id in $candidate_ids; do
                    if printf '%s\n' "$baseline_ids" | grep -Fxq "$candidate_id"; then
                      continue
                    fi
                    evidence=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id" \
                      --jq '[.path, .event, .head_branch, .head_sha, .display_title] | join("|")')
                    IFS='|' read -r run_path run_event run_branch run_sha run_title <<< "$evidence"
                    expected_path=".github/workflows/$workflow"
                    if [ "$run_path" = "$expected_path" ] &&
                       [ "$run_event" = workflow_dispatch ] &&
                       [ "$run_branch" = "$release_tag" ] &&
                       [ "$run_sha" = "$release_sha" ] &&
                       [ "$run_title" = "$expected_title" ]; then
                      run_id="$candidate_id"
                      break
                    fi
                  done
                  if [ -n "$run_id" ]; then break; fi
                  sleep $(( attempt < 5 ? attempt : 5 ))
                done
                if [ -z "$run_id" ]; then
                  echo "::error::$label did not start correlated run '$expected_title' for $release_tag ($release_sha)"
                  exit 1
                fi
                gh run watch "$run_id" --exit-status
              }

              dispatch_and_wait checks.yml Checks
              gh workflow run ci.yml --ref "$release_tag"
              echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

         - name: Summary
           env:
              RELEASE_TAG: ${{ steps.dispatch.outputs.tag }}
           run: |
              echo "### Release \`$RELEASE_TAG\` dispatched" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Exact-tag Checks passed. The tagged CI run now builds and verifies" >> "$GITHUB_STEP_SUMMARY"
              echo "every artifact, publishes the GitHub release, and deploys production." >> "$GITHUB_STEP_SUMMARY"

   # A red cut is as silent as a red publish was (v1.0.28-35): the preflight
   # check can fail, the atomic bump push can be rejected when main advances
   # mid-cut, or the explicit publish dispatch can fail. None of that reaches
   # ci.yml's release_train_alert, which only watches the publish path. File or
   # update the same pinned `release-train` issue here; the next green publish
   # closes it, so one issue tracks the whole train.
   cut_failed_alert:
      name: Alert on failed release cut
      needs: [gate, release]
      if: ${{ always() && (needs.gate.result == 'failure' || needs.release.result == 'failure') }}
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         issues: write
      env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
         GATE_RESULT: ${{ needs.gate.result }}
         RELEASE_RESULT: ${{ needs.release.result }}
      steps:
         - name: File or update the pinned release-train issue
           shell: bash
           run: |
              set -euo pipefail
              title="Release train red: the release cut failed (gate=$GATE_RESULT, release=$RELEASE_RESULT)"
              body=$(printf 'The release CUT failed before any tag was published (gate=%s, release=%s).\n\nRun: %s\n\nNo new version ships until a green cut; the next successful publish closes this issue automatically.' "$GATE_RESULT" "$RELEASE_RESULT" "$RUN_URL")
              # Self-heal the label: `gh issue create --label` hard-fails when the
              # label does not exist, which killed this alert on 2026-07-24 — a
              # dead alert is the worst failure mode this job can have.
              gh label create release-train --repo "$GITHUB_REPOSITORY" \
                --description "Pinned release-train status issue" --color D93F0B --force
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-train --state open --json number --jq '.[0].number // empty')
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --label release-train --title "$title" --body "$body"
              fi
              echo "::error::release cut failed (gate=$GATE_RESULT, release=$RELEASE_RESULT); release-train issue updated"
