# Fast product checks for the veyyon harness: lint, type checking, Rust format
# and clippy, changelog coherence, global-state leak detection, and the repo
# script gates. The TypeScript test buckets belong to ci.yml, which is the
# workflow a release tag runs (this one is push-to-main and pull-request only).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Release shas must never lose their gates to branch churn: v1.0.36's Checks run
# was cancelled by the next main push, so the release published without
# lint/typecheck completing on the released sha. This is the same release
# detection expression ci.yml owns. GitHub cannot share concurrency expressions
# across workflow files, so keep the checks/docs copies aligned with ci.yml.
concurrency:
  group: "checks-${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.sha) || (github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.ref) }}"
  cancel-in-progress: "${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}"

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Workspace type check
        run: bun run check:ts
      - name: Lint
        run: bun run lint:ts
      # `lint:ts` above runs `biome lint`, which checks lint rules ONLY. The
      # formatter and the assist actions (import organization) are separate
      # passes that only `biome check` runs, and nothing ran it: 39 files were
      # unformatted and 25 had unorganized imports while both gates reported
      # green. The previous step here was even labelled "Biome check" while
      # running pure TypeScript, so the absence read as coverage.
      - name: Format and import order
        run: bun run check:tools

  rust:
    name: Rust format & clippy
    # The cheapest gate in the repo has to be the first one that can fail. `cargo
    # fmt --all -- --check` answers in seconds, and it used to run in exactly one
    # place: the baseline entry of ci.yml's native matrix, behind an artifact
    # lookup, a toolchain install, an apt update, an sccache preflight and a
    # runner queue. A rewrapped doc comment in crates/veyyon-shell therefore
    # turned main red about 70 minutes into a CI run, and because all seven
    # TypeScript test jobs need that native job, one formatting slip cost the
    # whole cycle and blocked the release train behind it.
    #
    # `check:rs` runs fmt before clippy so a format diff is never reported as
    # lint noise, and this job is now the only place either runs: the duplicate
    # copy in actions/build-native was removed so the release path stops paying
    # for a workspace clippy build on a queue-bound runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # No `bun install` step: `bun run check:rs` reaches scripts/run-rs-task.ts,
      # which imports node: builtins and `bun` only, so a workspace install here
      # would be pure latency in front of a formatting check.
      - uses: ./.github/actions/ensure-rust-toolchain
        with:
          toolchain: nightly-2026-04-29
          components: clippy, rustfmt
      - name: Cache Rust target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: checks-rust-lint
          cache-on-failure: true
          # Only main writes the entry, so PR churn cannot evict the cache every
          # branch restores from.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
      - name: Format check and clippy
        run: bun run check:rs

  secrets:
    name: Secret scan
    # This repository is public, so "no real credential in the tree or its
    # history" has to be a gate rather than an audit someone remembers to run.
    # The answer today came from a hand scan of 2053 commits, and a hand scan
    # tells you about the past: several releases a day is exactly the cadence at
    # which one paste goes out before anybody looks again.
    #
    # Scoped to the commits this push or PR ADDS. The full history is already
    # clean and rescanning it every push would only pay for that fact again,
    # while the range is the question that can still change. `.gitleaks.toml`
    # carries the allowlist and says what each entry gives up; a base that is
    # unavailable (a first push, a force push, a manual dispatch) falls back to
    # the whole history rather than to scanning nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the base commit below has to be reachable, and the
          # fallback scan needs every commit.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the commits this change adds
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${SCAN_BASE}" ] || [ "${SCAN_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; scanning the whole history."
            gitleaks git . --redact --no-banner
          else
            echo "Scanning ${SCAN_BASE}..HEAD"
            gitleaks git . --redact --no-banner --log-opts "${SCAN_BASE}..HEAD"
          fi

  changelog:
    name: Changelog entry
    # Gate BOTH PRs and direct pushes to main. This repo lands changes directly
    # on main (no PR), so a PR-only gate never fires and hundreds of commits
    # shipped source with an empty `## [Unreleased]` section — releases then
    # documented almost nothing. On a push the base is `github.event.before`
    # (the branch tip before the push); the gate fails when a publishable
    # package's shipped source changed with no `## [Unreleased]` entry.
    #
    # Two push cases are exempt:
    #   - `github.event.before` all-zeros: a first push / force-push / branch
    #     create has no prior tip to diff against.
    #   - `chore: bump version to ...`: the release workflow's own bump commit,
    #     which drains the Unreleased section by design and legitimately adds
    #     no new entry.
    # There is no per-commit escape hatch. Shipped source gets a changelog line,
    # including a line that says the change has no user-facing effect.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.event.before != '0000000000000000000000000000000000000000' &&
       !startsWith(github.event.head_commit.message, 'chore: bump version to'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the merge-base against the base ref resolves.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Require a changelog entry for changed source
        env:
          # PR: the base commit GitHub records for the PR. Push: the branch tip
          # before this push. Either is an ancestor reachable in the full
          # history checked out above, so no extra fetch is needed.
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run changelog:check
      - name: Require the repo-root CHANGELOG to match the canonical source
        # The root CHANGELOG.md is generated from packages/coding-agent/CHANGELOG.md
        # (same rebrand the website uses). Fail if it drifted; the fix is to run
        # `bun run changelog:root`.
        run: bun run changelog:root:check

  test-leaks:
    name: Global-state leaks (changed suites)
    # A suite that leaves a `VEYYON_*` variable, the working directory, or the active
    # profile changed makes every file that runs after it order-dependent, and the
    # failures land in innocent suites: a lingering `VEYYON_NO_TITLE` made three
    # title-generator suites fail while each passed alone, and two suites exported the
    # developer's real agent dir to the whole process. `scripts/test-sandbox/find-test-leaks.ts`
    # runs each file in its own process with a tracer preloaded and diffs the globals.
    #
    # Scoped to the test files this push/PR CHANGED, not the whole repo: a full sweep is
    # one process per file (~1700 files in the coding-agent tree alone) and belongs in a
    # nightly, while the gate that matters is "the suite you just wrote does not leak".
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the base commit below is reachable for the diff.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build native addon
        # Same reason as the test job: suites that touch grep/PTY/hashline need the
        # compiled addon, and a suite that fails to RUN gives no leak verdict at all.
        run: bun run ci:build:native
      - name: Build the test sandbox image
        # This job is separate from `test` below and never built the sandbox, so
        # the unconditional gate refused both steps here and the job went red
        # without leak-checking anything. The tracer spawns one `bun test` per
        # file, and those children face the same gate, so the whole tracer runs
        # inside the boundary rather than only its self-tests.
        run: bash scripts/test-sandbox/run.sh --build
      - name: Tracer self-tests
        # The tracer's own contract tests, so a broken tracer fails loudly here instead
        # of silently reporting every changed suite as clean.
        run: bash scripts/test-sandbox/run.sh bun test scripts/test-sandbox/find-test-leaks.test.ts
      - name: Leak-check changed test files
        env:
          LEAK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # `mapfile ... < <(git ...)` reports the exit status of mapfile, never of
          # the process substitution, so neither `-e` nor `pipefail` sees a failing
          # git. An unreachable LEAK_BASE then produced an empty array, the gate
          # printed "No test files changed" and exited 0, and a push whose suites
          # were never leak-checked reported green. Capture first: a plain
          # assignment is a status `-e` does see.
          changed_list="$(git diff --name-only --diff-filter=d "$LEAK_BASE"...HEAD -- '*.test.ts')"
          if [ -z "$changed_list" ]; then
            echo "No test files changed; nothing to leak-check."
            exit 0
          fi
          mapfile -t changed <<<"$changed_list"
          printf 'Leak-checking %d changed test file(s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          bash scripts/test-sandbox/run.sh bun scripts/test-sandbox/find-test-leaks.ts "${changed[@]}"

  # The TypeScript test buckets live in ci.yml, all seven of them, and this job
  # used to be an eighth that ran `ci:test:ts:workspace` a second time. Both
  # workflows fire on the same push, so every push paid for the same bucket twice
  # and paid a from-scratch `cargo` native build here for a bucket ci.yml serves
  # from a cached artifact. Two full runs against a ~20-job account ceiling is
  # what made a second push in fifteen minutes queue behind the first, and the
  # answer to "is main green" arrive later than it had to. Checks keeps the gates
  # that need no native addon and answer in a minute or two; ci.yml owns the
  # tests.
  test-scripts:
    name: Repo script gates
    # The suites in `repoScriptTests`: the release train, the installers, the
    # changelog and docs gates, and the coverage locks that check the other gates.
    #
    # This job exists because for a long time none of them ran. CI's only bucket
    # that touched scripts was `ci:test:ts:workspace`, which carried its own
    # hardcoded list of 15 files, so the remaining 69 in `repoScriptTests` were
    # named by no workflow. They did not report as skipped. They simply never
    # executed, and 79 assertions were red on main while every check reported
    # green, among them a stale installer contract and a script-ownership gate that
    # had been failing since the demos landed. Deleting this job puts them back to
    # running nowhere, so delete the suites instead if they stop earning their run.
    #
    # Separate from `test` because it needs no native addon and finishes in about
    # ten seconds, so a red gate here names itself instead of hiding in a long run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release and changelog gates diff against history. A shallow clone
          # gives them one commit and they pass by having nothing to compare.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build the test sandbox image
        # Same reason as the `test` job: `bun run test:scripts` routes through
        # scripts/test-sandbox/run.sh, which refuses to run anything on the bare runner.
        run: bash scripts/test-sandbox/run.sh --build
      - name: Repo script test suites
        run: bun run test:scripts
