			:root{
				--bg:#000000; --raised:#000000; --fg:#f6f7f9; --fg-2:#b4bac4; --muted:#7c828d;
				--silver:#c6cbd4; --silver-hi:#e6e9ee; --blue:#6ba3e8;
				--green:#7fb98a; --red:#c96f6e;
				--line:rgba(198,203,212,.12); --line-2:rgba(198,203,212,.21);
				--sans:"InterV",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
				--mono:"JBM",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
				color-scheme:dark;
			}
			*{box-sizing:border-box}
			body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
				background:var(--bg);color:var(--fg);font-family:var(--sans);
				-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
			.card{width:100%;max-width:400px;border:1px solid var(--line-2);background:var(--raised);padding:0}
			.top{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--line)}
			.mark{width:9px;height:9px;background:var(--silver);transform:rotate(45deg);flex:none}
			.wordmark{font-family:var(--mono);font-weight:600;letter-spacing:.22em;font-size:12.5px;color:var(--fg)}
			.rt{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
			.body{padding:30px 26px 26px}
			.status{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;margin-bottom:22px}
			.status .glyph{font-size:11px}
			.status .word{letter-spacing:.02em}
			.status .tag{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
				padding:2px 8px;border:1px solid var(--line-2)}
			h1{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px}
			p{color:var(--fg-2);line-height:1.6;margin:0 0 24px;font-size:14px}
			.btn{display:inline-flex;align-items:center;gap:8px;background:var(--silver-hi);color:#08090b;
				font-family:var(--sans);font-weight:500;padding:10px 20px;font-size:13.5px;border:1px solid var(--silver-hi);
				text-decoration:none;cursor:pointer;transition:background .14s,border-color .14s}
			.btn:hover{background:#fff;border-color:#fff}
			.prog{height:1px;background:var(--line);margin-top:24px;overflow:hidden;display:none}
			.prog span{display:block;height:100%;width:100%;background:var(--silver);transform-origin:left}
			.countdown .prog{display:block}
			.countdown .prog span{animation:drain 3s linear forwards}
			@keyframes drain{to{transform:scaleX(0)}}
			/* success */
			.success .status .glyph{color:var(--green)} .success .status .tag{color:var(--green);border-color:rgba(127,185,138,.4)}
			.success .icon-error{display:none}
			/* error */
			.error .status .glyph{color:var(--red)} .error .status .tag{color:var(--red);border-color:rgba(201,111,110,.4)}
			.error .icon-success{display:none}
			@media (prefers-reduced-motion:reduce){.countdown .prog span{animation:none;transform:scaleX(0)}}
		</style>
	</head>
	<body>
		<div id="app" class="card">
			<div class="top">
				<span class="mark" aria-hidden="true"></span>
				<span class="wordmark">VEYYON</span>
				<span class="rt">auth</span>
			</div>
			<div class="body">
				<div class="status">
					<span class="glyph icon-success" aria-hidden="true">&#9670;</span>
					<span class="glyph icon-error" aria-hidden="true">&#10005;</span>
					<span class="word" id="statusword">connecting</span>
					<span class="tag" id="statustag">ok</span>
				</div>
				<h1 id="title">Authentication</h1>
				<p id="message"></p>
				<button onclick="window.close()" class="btn">Close window</button>
				<div class="prog" aria-hidden="true"><span></span></div>
			</div>
		</div>

		<script id="server-state" type="application/json">
			__OAUTH_STATE__
		</script>
		<script>
			let serverState;
			try {
				serverState = JSON.parse(document.getElementById("server-state").textContent);
			} catch {
				const params = new URLSearchParams(window.location.search);
				serverState = { ok: params.get("ok") === "1", error: params.get("error") || "Authentication failed" };
			}
			const app = document.getElementById("app");
			const title = document.getElementById("title");
			const message = document.getElementById("message");
			const statusword = document.getElementById("statusword");
			const statustag = document.getElementById("statustag");
			if (serverState.ok) {
				app.classList.add("success", "countdown");
				statusword.textContent = "authenticated";
				statustag.textContent = "ok";
				title.textContent = "Signed in";
				message.innerHTML = "You're signed in to Veyyon. This tab will close automatically — or close it now and return to your terminal.";
				setTimeout(() => window.close(), 3000);
			} else {
				app.classList.add("error");
				statusword.textContent = "sign-in failed";
				statustag.textContent = "err";
				title.textContent = "Sign-in failed";
				message.textContent = serverState.error || "An error occurred. Return to your terminal and try again.";
			}
		</script>
	</body>
</html>
