# Which environment variable NAMES look like they hold a credential.
#
# Tier B data, not a literal in a .ts file, so you can extend it without a rebuild. Drop a file of
# the same shape at `<agent dir>/secret-env-keywords.yml` or `<project>/.veyyon/secret-env-keywords.yml`
# and its keywords are added to these. Nothing is ever removed by a user file: a keyword you cannot
# take away is the safe direction for a detection list.
#
# THE BOUNDARY RULE, which is what makes this list small. A keyword matches only where it ENDS the
# name or is followed by an underscore, so `DEPLOY_TOKEN` and `TOKEN_FILE` match while `TOKENIZER`
# does not. Read each entry as a whole word, not a substring. The trailing-position half of that
# rule is why `APIKEY`, `PRIVKEY` and `SECRETKEY` need no entry of their own: `KEY` at the end of a
# name already matches them.
#
# WHAT IS DELIBERATELY ABSENT, so nobody adds it back without reading this:
#
#   PWD  -  REFUSED, and it is the one candidate with a severe false positive. `PWD` is the POSIX
#           current-working-directory variable, it exists in every shell, and its value is a path
#           that is almost always over the length floor. Detecting it would replace your working
#           directory with a placeholder in every message that mentions a path, which shreds
#           ordinary text rather than protecting anything. `OLDPWD` is the same.
#
# If a variable of yours is not detected, do not assume it is covered: declare it in `secrets.yml`,
# or store it with `/secret`.

keywords:
  - KEY
  - SECRET
  - TOKEN
  - PASSWORD
  # PASS matches `MY_PASS` and `PASS_FILE`, and NOT `PASSPHRASE`, which is why the next entry
  # exists. The boundary rule is doing its job here rather than failing: widening `PASS` to a
  # substring would match `PASSED`, `PASSTHROUGH` and `BYPASS_CACHE`.
  - PASS
  # A real name for a real secret, and the one genuine gap the original list had. `GPG_PASSPHRASE`
  # was detected only because of the underscore before it; a bare `PASSPHRASE` was not detected at
  # all. No common non-secret variable is named `*PASSPHRASE`, so there is no false positive to
  # trade away.
  - PASSPHRASE
  - AUTH
  - CREDENTIAL
  - PRIVATE
  - OAUTH
