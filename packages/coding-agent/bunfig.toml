# Bun reads bunfig.toml from the current working directory only, so the
# repository-root config does not apply when you run `bun test` from inside this
# package, and everything the root config sets up has to be re-pointed here.
# See docs/internal/testing.md.
[test]
# Two preloads, for two different fresh-checkout hazards:
#  - the real-data tripwire, which refuses any write into the developer's real
#    ~/.veyyon (it lives in exactly one place; only this pointer repeats,
#    because Bun offers no way to inherit a parent config)
#  - the tool-views build artifact, which this package imports at module parse
#    time and which a bare `bun test` would otherwise fail on before running a
#    single assertion
preload = ["../utils/test/helpers/real-data-tripwire.ts", "./test/helpers/tool-views-preload.ts"]
