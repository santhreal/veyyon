# Bun reads bunfig.toml from the current working directory only, so the
# repository-root config does not apply when you run `bun test` from inside this
# package. This re-points the same shared preload: the real-data tripwire, which
# refuses any write into the developer's real ~/.veyyon.
#
# The tripwire itself lives in exactly one place
# (packages/utils/test/helpers/real-data-tripwire.ts); only this pointer repeats,
# because Bun offers no way to inherit a parent config. See docs/internal/testing.md.
[test]
preload = ["../utils/test/helpers/real-data-tripwire.ts"]

# `datasets/repo-cache/` holds cloned upstream repositories for the DeepSWE suite:
# 113 of them, about 1.9G, each a real project with its own test suite. Bun does not
# honour .gitignore, so without this a `bun test` here walks into all of them and
# reports THEIR failures as this repository's. `datasets/deep-swe/corpus/` is the
# vendored task corpus, `runs/` holds trial artifacts and `.internal/` holds review
# scratch; none of them carries our tests. `every-arm-flag-and-task-set-the-docs-name-exists.test.ts` fails when an
# ignored directory has no entry here.
pathIgnorePatterns = [
	"**/node_modules/**",
	"datasets/repo-cache/**",
	"datasets/deep-swe/corpus/**",
	"runs/**",
	".cache/**",
	".internal/**",
]
