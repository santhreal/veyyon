[workspace]
members = ["crates/veyyon-*", "crates/vendor/*"]
# Vendored third-party trees are path dependencies, not gate members: their own
# repositories test them. The GPUI closure is the 23 crates scripts/vendor-gpui.ts
# extracts from santhreal/zed; edit them there and re-vendor.
exclude = [
	"crates/vendor/brush-core",
	"crates/vendor/brush-builtins",
	"crates/vendor/collections",
	"crates/vendor/derive_refineable",
	"crates/vendor/gpui",
	"crates/vendor/gpui_apple",
	"crates/vendor/gpui_linux",
	"crates/vendor/gpui_macos",
	"crates/vendor/gpui_macros",
	"crates/vendor/gpui_platform",
	"crates/vendor/gpui_shared_string",
	"crates/vendor/gpui_util",
	"crates/vendor/gpui_web",
	"crates/vendor/gpui_wgpu",
	"crates/vendor/gpui_windows",
	"crates/vendor/http_client",
	"crates/vendor/media",
	"crates/vendor/perf",
	"crates/vendor/refineable",
	"crates/vendor/scheduler",
	"crates/vendor/sum_tree",
	"crates/vendor/util_macros",
	"crates/vendor/zlog",
	"crates/vendor/ztracing",
	"crates/vendor/ztracing_macro",
]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
authors = ["santhreal"]
homepage = "https://veyyon.dev/"
repository = "https://github.com/santhreal/veyyon"

[patch.crates-io]
brush-core = { path = "crates/vendor/brush-core" }
brush-builtins = { path = "crates/vendor/brush-builtins" }
# async-task: smol executor tasks used by gpui, gpui_macos, and scheduler
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# async-process: async process spawning used transitively by gpui_linux via smol
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
# calloop: event loop used by gpui_linux
calloop = { git = "https://github.com/zed-industries/calloop" }
# windows-capture: screen capture backend used transitively by gpui_windows and gpui via scap
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind (not abort) so panics inside vendored code and native tasks stay
# recoverable at the appropriate boundary: the uutils boundary
# (veyyon-shell coreutils) turns a panic into a failed command, and the
# `task::blocking` wrapper in `crates/veyyon-natives/src/task.rs` catches unwinds
# inside `Blocking::compute` before they cross napi-rs's async-work
# `extern "C"` callback (napi `src/async_work.rs:109`) so they surface as
# rejected JS Promises instead of forced process aborts under Rust's C-unwind
# rules (RFC 2945, stable since 1.81). napi-rs does NOT install its own
# per-call `catch_unwind` on the `Task`/`AsyncTask` path; the tokio-future
# path (`env.spawn_future`) is guarded upstream. Recoverable uutils panics
# are kept out of the crash report by the crash hook
# (see crates/veyyon-natives/src/crash_handler.rs).
panic = "unwind"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = "symbols"
split-debuginfo = "off"

[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Deps compile optimized once and cache; your own crates stay fast.
[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace.lints.rust]
# ──────────────────────────────────────────────────────────────────────────────
# Rust Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
# ──────────────────────────────────────────────────────────────────────────────
# Base Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# ──────────────────────────────────────────────────────────────────────────────
# Meta: Lint Attributes
# ──────────────────────────────────────────────────────────────────────────────
allow_attributes_without_reason = "warn" # Enforce reason for all #[allow]

# ──────────────────────────────────────────────────────────────────────────────
# Safety & Unsafe Code
# ──────────────────────────────────────────────────────────────────────────────
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"

# ──────────────────────────────────────────────────────────────────────────────
# Numeric Casts & Conversions
# ──────────────────────────────────────────────────────────────────────────────
cast_lossless = "allow"            # u32 as u64 - 'as' is cleaner than From
cast_possible_truncation = "allow" # u64 as u32 - often intentional
cast_possible_wrap = "allow"       # u32 as i32 - can be intentional
cast_precision_loss = "allow"      # f64 as f32 - sometimes acceptable
cast_sign_loss = "allow"           # i32 as u32 - sometimes needed
tuple_array_conversions = "allow"  # Non-Into conversion is more clear

# ──────────────────────────────────────────────────────────────────────────────
# Floating Point
# ──────────────────────────────────────────────────────────────────────────────
float_cmp = "allow" # Tests mostly do this + we know what we're doing

# ──────────────────────────────────────────────────────────────────────────────
# Functions & Closures
# ──────────────────────────────────────────────────────────────────────────────
inline_always = "allow"                      # Needed for performance-critical code
must_use_candidate = "allow"                 # Not every function needs #[must_use]
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow" # .map(ToString::to_string) can be clearer
return_self_not_must_use = "allow"           # Builder pattern methods

# ──────────────────────────────────────────────────────────────────────────────
# Structs & Types
# ──────────────────────────────────────────────────────────────────────────────
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"         # Not every field needs to be in Debug output
struct_excessive_bools = "allow"          # Usually with builders

# ──────────────────────────────────────────────────────────────────────────────
# Pattern Matching
# ──────────────────────────────────────────────────────────────────────────────
match_same_arms = "allow"                    # Can be intentional for clarity
match_wildcard_for_single_variants = "allow" # _ can be clearer than listing variants
option_if_let_else = "allow"                 # match/if-let-else often clearer

# ──────────────────────────────────────────────────────────────────────────────
# Imports & Module Organization
# ──────────────────────────────────────────────────────────────────────────────
enum_glob_use = "allow"
items_after_statements = "allow" # Sometimes more readable
wildcard_imports = "allow"       # Cleaner for preludes and test modules

# ──────────────────────────────────────────────────────────────────────────────
# Variables & Type Inference
# ──────────────────────────────────────────────────────────────────────────────
let_underscore_untyped = "allow" # Type obvious from context
similar_names = "allow"          # 'req' and 'res' together are fine

# ──────────────────────────────────────────────────────────────────────────────
# Literals & Formatting
# ──────────────────────────────────────────────────────────────────────────────
unreadable_literal = "allow" # 10_000_000 vs 0xDEADBEEF is context dependent
verbose_bit_mask = "allow"   # Explicit bit patterns can be clearer than hex

# ──────────────────────────────────────────────────────────────────────────────
# Code Style
# ──────────────────────────────────────────────────────────────────────────────
default_trait_access = "allow"        # Default::default() sometimes clearer
significant_drop_tightening = "allow" # We pay attention to this already

# ──────────────────────────────────────────────────────────────────────────────
# Documentation
# ──────────────────────────────────────────────────────────────────────────────
missing_errors_doc = "allow" # Documenting every error return is often redundant
missing_panics_doc = "allow" # Not every panic needs docs, especially assert!

# ──────────────────────────────────────────────────────────────────────────────
# Complexity
# ──────────────────────────────────────────────────────────────────────────────
too_many_arguments = "allow" # Argument count is rarely the real complexity signal
too_many_lines = "allow"     # Arbitrary limits don't account for necessary complexity

[workspace.dependencies]

# ──────────────────────────────────────────────────────────────────────────────
# Internal Libraries
# ──────────────────────────────────────────────────────────────────────────────
veyyon-ast = { path = "crates/veyyon-ast" }
veyyon-iso = { path = "crates/veyyon-iso" }
veyyon-diff-kernel = { path = "crates/veyyon-diff-kernel" }
veyyon-glob = { path = "crates/veyyon-glob" }
veyyon-grep-kernel = { path = "crates/veyyon-grep-kernel" }
veyyon-keys = { path = "crates/veyyon-keys" }
veyyon-shell = { path = "crates/veyyon-shell" }
veyyon-test-scratch = { path = "crates/veyyon-test-scratch" }
veyyon-text = { path = "crates/veyyon-text" }
veyyon-uu-diff = { path = "crates/veyyon-uu-diff" }
veyyon-uu-grep = { path = "crates/veyyon-uu-grep" }
veyyon-uutils-ctx = { path = "crates/veyyon-uutils-ctx" }
veyyon-walker = { path = "crates/veyyon-walker" }
veyyon-desktop-model = { path = "crates/veyyon-desktop-model" }
veyyon-desktop-motion = { path = "crates/veyyon-desktop-motion" }
veyyon-desktop-tokens = { path = "crates/veyyon-desktop-tokens" }
veyyon-desktop-kit = { path = "crates/veyyon-desktop-kit" }
veyyon-desktop-surface = { path = "crates/veyyon-desktop-surface" }
veyyon-desktop = { path = "crates/veyyon-desktop" }
veyyon-gpui = { path = "crates/veyyon-gpui" }
veyyon-desktop-scene = { path = "crates/veyyon-desktop-scene" }
brush-core = { path = "crates/vendor/brush-core" }
brush-builtins = { path = "crates/vendor/brush-builtins" }

# ──────────────────────────────────────────────────────────────────────────────
# Async Runtime & Concurrency
# ──────────────────────────────────────────────────────────────────────────────
async-trait = "0.1"
dashmap = "6.1"
parking_lot = "0.12.5"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
flume = "0.11"

# ──────────────────────────────────────────────────────────────────────────────
# Serialization & Data Formats
# ──────────────────────────────────────────────────────────────────────────────
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"
# Variant iteration for the desktop protocol enums. Every scene gate and capability sweep
# enumerates a union at run time, and a hand-written `ALL` array goes stale in silence when
# someone adds a variant. `EnumIter` and `EnumDiscriminants` derive the space from the enum,
# so a new variant turns a sweep red instead of being skipped. Already in the lock at this
# version through the vendored brush crates.
strum = { version = "0.28", features = ["derive"] }

# ──────────────────────────────────────────────────────────────────────────────
# Error Handling
# ──────────────────────────────────────────────────────────────────────────────
anyhow = "1.0"
bytes = "1"
# Named error types for the desktop crates. A library API returns a variant a caller can
# match, so `anyhow` stays at the binary boundary where the context string is the product.
thiserror = "2"

# ──────────────────────────────────────────────────────────────────────────────
# CLI & Configuration
# ──────────────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }
# `rg --generate` writes a man page and shell completions from the SAME clap
# command the parser uses, so the artifacts can never promise a flag the tool
# refuses. Both are clap's own generators and add no transitive weight worth
# naming.
clap_complete = "4"
clap_mangen = "0.3"

# ──────────────────────────────────────────────────────────────────────────────
# Text Processing & Parsing
# ──────────────────────────────────────────────────────────────────────────────
regex = "1"
# The escaping half of `regex`, which is where `regex::escape` actually lives. Depended on
# directly by veyyon-grep-kernel so the one owner of literal escaping does not pull the whole
# engine in behind it; it is already in the graph under grep-regex, so this costs no build time.
regex-syntax = "0.8"
# The engine half of `regex`, for the ONE thing `regex` itself cannot express: a
# POSIX leftmost-longest span, which GNU grep reports and leftmost-first engines do
# not. Already in the graph under `regex` and grep-regex, so this costs no build time.
regex-automata = "0.4"
similar = "3.1.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"
fontdue = { version = "0.9", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Data Structures - Collections
# ──────────────────────────────────────────────────────────────────────────────
phf = { version = "0.13", features = ["macros"] }
smallvec = { version = "1.15.1", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Hashing
# ──────────────────────────────────────────────────────────────────────────────
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# BLAKE3 is the corpus's identity function, not a speed choice: a conformance
# case is named by the digest of its own semantics, so the digest has to be
# stable across platforms and cheap enough to compute for 250,000 rows on every
# materialization. xxh64 above is a non-cryptographic bucket hash and cannot
# carry an identity that a committed corpus is keyed by.
blake3 = "1"

# ──────────────────────────────────────────────────────────────────────────────
# Wire Protocols
# ──────────────────────────────────────────────────────────────────────────────
# The Cursor provider does not speak HTTP/1.1. It calls `http2.connect()` on a
# plain `http:` URL, which is h2c with prior knowledge: a client preface and a
# SETTINGS exchange before any request. A mock that only parses request lines
# cannot answer it, so every Cursor case would be unverifiable, including the
# GOAWAY and RST_STREAM paths that `http2RetryVerdict` in packages/ai maps to
# retry decisions and that nothing currently exercises against a real h2 peer.
# `h2` is the framing layer under hyper, needs no TLS for h2c, and is used only
# by the conformance harness, which is `publish = false`.
h2 = "0.4"
# `h2` speaks in `http` types and re-exports none of them, so a server that sets
# a status or a header name has to name `http::Response`, `HeaderName` and
# `HeaderValue` itself. It is already in the lock file under `h2`.
http = "1"


# ──────────────────────────────────────────────────────────────────────────────
# System & Platform
# ──────────────────────────────────────────────────────────────────────────────
libc = "0.2"
os_pipe = "1"
windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Storage_FileSystem",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_JobObjects",
   "Win32_System_LibraryLoader",
   "Win32_System_IO",
   "Win32_System_Ioctl",
   "Win32_System_Threading",
   "Win32_Security",
] }
winreg = "0.56"

# ──────────────────────────────────────────────────────────────────────────────
# Node.js Bindings (NAPI)
# ──────────────────────────────────────────────────────────────────────────────
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"

# ──────────────────────────────────────────────────────────────────────────────
# Terminal & PTY
# ──────────────────────────────────────────────────────────────────────────────
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clipboard-win = "5.4"
icy_sixel = "0.5"
portable-pty = "0.9"

# ──────────────────────────────────────────────────────────────────────────────
# Search & File Walking
# ──────────────────────────────────────────────────────────────────────────────
globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
memchr = "2.8"
# The token watcher in veyyon-desktop-tokens. Hot reload is the mechanism the whole
# iteration engine rests on, so the watch is a real filesystem notification rather than a
# poll: a sweep re-renders on save, and a poll interval is a lower bound on every pass.
notify = "8"

# ──────────────────────────────────────────────────────────────────────────────
# Image Processing & Syntax Highlighting
# ──────────────────────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }
png = "0.18"
inferno = { version = "0.12", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
   "yaml-load",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Markup Conversion
# ──────────────────────────────────────────────────────────────────────────────
html-to-markdown-rs = { version = "2.24", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Tokenization
# ──────────────────────────────────────────────────────────────────────────────
tiktoken-rs = "0.11"

# ──────────────────────────────────────────────────────────────────────────────
# Shell Parsing
# ──────────────────────────────────────────────────────────────────────────────
brush-parser = "0.3"

# ──────────────────────────────────────────────────────────────────────────────
# AST & Tree-Sitter
# ──────────────────────────────────────────────────────────────────────────────
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "0.3"
tree-sitter-elisp = "1.6.1"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25"
tree-sitter-r = "1.2.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "0.7"
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# ──────────────────────────────────────────────────────────────────────────────
# GUI & Renderer
# ──────────────────────────────────────────────────────────────────────────────
# GPUI renderer, vendored under crates/vendor from santhreal/zed at the commit recorded in
# crates/vendor/GPUI_VENDOR_REV. Regenerate with
# `bun scripts/vendor-gpui.ts --source <zed checkout> --rev <commit>`.
# The tree carries the renderer patch series the front end requires: affine transforms, animator
# identity, native delay, backdrop blur, inner shadow and inset hairline, per-corner radii, damage
# scoped redraw, rounded and path content masks, the persistent text advance cache, and the
# headless deterministic offscreen surface with surfaceless wgpu context, offscreen render target,
# RGBA8 readback, and text-run and hitbox metadata.
gpui = { path = "crates/vendor/gpui" }
# The headless offscreen path needs the platform crate, which builds the renderer for the current
# OS, and the wgpu crate, which supplies the text system.
gpui_platform = { path = "crates/vendor/gpui_platform" }
gpui_wgpu = { path = "crates/vendor/gpui_wgpu" }

# ──────────────────────────────────────────────────────────────────────────────
# Unsorted (added by `cargo add` - move into a section above)
# ──────────────────────────────────────────────────────────────────────────────
