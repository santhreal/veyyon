providers:
  local:
    baseUrl: http://veyyon-proof-llm:8080/v1
    api: openai-completions
    apiKey: LOCAL_LLM_KEY
    models:
      # Every row points at the one llama.cpp server on the recorder's network,
      # which serves whatever weights it was started with and ignores the model
      # name in a request. The rows below the first are catalog entries for the
      # other quantizations of the same weights, so the model picker has a list
      # a pointer can travel over. A turn on any of them is a real turn.
      - id: qwen2.5-1.5b
        name: Qwen2.5 1.5B (local)
        contextWindow: 65536
        maxTokens: 1024
      - id: qwen2.5-1.5b-q8
        name: Qwen2.5 1.5B q8_0 (local)
        contextWindow: 65536
        maxTokens: 1024
      - id: qwen2.5-1.5b-q5
        name: Qwen2.5 1.5B q5_k_m (local)
        contextWindow: 65536
        maxTokens: 1024
      - id: qwen2.5-1.5b-q4
        name: Qwen2.5 1.5B q4_k_m (local)
        contextWindow: 65536
        maxTokens: 1024
      - id: qwen2.5-1.5b-f16
        name: Qwen2.5 1.5B f16 (local)
        contextWindow: 65536
        maxTokens: 1024
      # The HD demo runs against a 30B mixture-of-experts served by ollama on the
      # recorder host instead of the 1.5B above: a demo has to show real tool use,
      # and a 1.5B answers a question but does not drive an edit. Ollama DOES honor
      # the model name in a request, so this id is the tag it serves, aliased with
      # `ollama cp` to a name with no colon in it.
      - id: demo-qwen3-30b
        name: Qwen3 30B A3B (local)
        contextWindow: 131072
        maxTokens: 4096
      # The same weights declared with a smaller window, for the compaction scene.
      # Compaction is driven by pressure on the window the model row declares, and
      # 131k is more than this tiny project can fill in a recording: the session
      # reaches 22k and `/compact` correctly refuses with "nothing to compact". The
      # size is measured rather than picked -- the system prompt and the tool
      # schemas alone are about 19k of that 22k, so a window under 24k cannot hold
      # a session at all, and 32k leaves room for two read turns to reach the
      # autocompact buffer. Nothing here is a trick: the request is truncated to
      # this window and the report is measured against it, so the recording shows
      # the product's own behaviour under a window that is genuinely filling.
      - id: demo-qwen3-30b-32k
        name: Qwen3 30B A3B 32k (local)
        contextWindow: 32768
        maxTokens: 2048
      # The dense 32B, which is what the gallery records against now. The quant is
      # the decision here, and it was measured rather than guessed: q4_K_M is 20 GB
      # of weights, and with a 32k window allocated the server ran 22% of the layers
      # on the CPU and generated 8 tokens a second, which is not a session anyone
      # would watch. IQ4_XS is 17 GB, sits at 22 GB resident with the same window,
      # reports 100% GPU and generates 48. Serve it as
      # hf.co/unsloth/Qwen3-32B-GGUF:IQ4_XS with num_ctx 32768.
      #
      # One row, and the window is 32k because that is the window the server was
      # built with. Ollama fixes the context length when it loads the weights and
      # the OpenAI-compatible request cannot raise it, so a row declaring 131k
      # would be a client accounting against a server that silently truncates to
      # its own. The number here is the served number.
      - id: demo-qwen3-32b-32k
        name: Qwen3 32B (local)
        contextWindow: 32768
        maxTokens: 2048
