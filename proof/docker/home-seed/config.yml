# Machine-wide config for the recording container only. The operator's own
# ~/.veyyon is not mounted here; this file exists so a tape does not spend its
# first fifteen seconds in the setup wizard, and so every capture is taken
# against one known theme and one known model.
onboardingVersion: 99
theme: titanium
# The row the gallery records against, so a launch that passes no --model (the
# install row starts the installed binary the way a person would) shows the same
# model as every other row rather than the 1.5B this file used to name.
model: local/demo-qwen3-32b-32k
# `/branch` follows this setting: `tree` sends it to the session tree, which the
# recordings reach with `/tree` anyway. Seeding `branch` is what makes the
# fourth picker -- the user-message card -- reachable in a scene.
doubleEscapeAction: branch
