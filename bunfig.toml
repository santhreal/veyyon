telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
# A pinned `overrides` entry in package.json is a REVIEWED decision, usually a
# security bump, so the age heuristic must not veto it: brace-expansion was
# pinned to ^5.0.8 for GHSA-mh99-v99m-4gvg while 5.0.8 was ~40 hours old, and
# any install resolving from scratch died with "No version matching". Every
# override key belongs here, which `scripts/dependency-overrides.test.ts`
# enforces so the two lists cannot drift.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "@ark/schema", "tar", "adm-zip", "sharp", "brace-expansion"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# Loaded before ANY test module in EVERY test process started from this directory.
# It refuses every write into the real ~/.veyyon (node:fs AND bun:sqlite), so a
# suite cannot damage real credentials even when its own isolation is wrong or
# missing. A preload rather than a helper because the protection must not be
# opt-in: the incident it exists for happened in a suite that never called the
# helper. Bun reads bunfig.toml from the cwd only, so each package carries its own
# pointer to this same file, and scripts/ci-test-ts.ts passes it explicitly with
# --preload. See docs/internal/testing.md.
#
# The second preload moves mnemopi's home-derived roots (`.hermes`, `.mnemopi`)
# into a temp directory. It belongs here as well as in packages/mnemopi/bunfig.toml
# because a mnemopi suite is routinely run from the repository root — by the leak
# tracer, and by anyone typing a path — and cwd is what decides which of the two
# files Bun reads.
preload = [
  "./packages/utils/test/helpers/real-data-tripwire.ts",
  "./packages/mnemopi/test/helpers/home-isolation.ts",
]

# bun test does NOT honor .gitignore; prune veybot's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/veybot/data/**",
  # The deepswe benchmark's cloned upstream repositories: 113 real projects,
  # about 1.9G, each with its own test suite. A root `bun test` walked into them
  # and reported their failures as ours — nine test files from a cached Effect
  # checkout, all failing on a dependency this repository does not install.
  "packages/deepswe-bench/repo-cache/**",
  ".wt/**",
  ".worktrees/**",
]

[run]
bun = true
