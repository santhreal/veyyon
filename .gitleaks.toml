# Secret scanning config for the repository, used by the `secrets` job in
# .github/workflows/checks.yml and by `gitleaks` run by hand.
#
# WHY THIS FILE EXISTS
# --------------------
# This repository is public, so "no real credential in the tree or its history"
# has to be a standing gate rather than an audit someone remembers to run. A scan
# with no allowlist is not that gate: the tree carries fabricated tokens by
# design (a suite that proves a credential is redacted has to contain one), and a
# report where every finding is noise is one nobody reads. Each entry below names
# the class it forgives and why that class cannot hold a real secret.
#
# WHAT AN ENTRY COSTS
# -------------------
# An allowlisted path is a path where a real credential would NOT be caught here.
# That is the trade, so entries are paths and value patterns rather than whole
# package trees, and a new one needs a sentence saying why the class is safe.

[extend]
useDefault = true

[allowlist]
description = "Fabricated fixtures, generated output, and public identifiers."
paths = [
  # Build output and dependency caches. The CI gate scans COMMITS, so it never
  # sees these; they are here so `gitleaks dir .` by hand answers the same
  # question instead of 1167 findings inside .bun caches and vendored deps.
  '''(^|/)node_modules/''',
  '''(^|/)\.bun/''',
  '''(^|/)dist/''',
  '''(^|/)binaries/''',
  '''(^|/)target/''',
  '''\.pile$''',
  # Generated mdbook output. Every finding here is a rendered copy of a docs
  # example already scanned at its source under docs/handbook/src/.
  '''^docs/handbook/book/''',
  '''^website/docs/''',
  # Test fixtures. A suite that proves a token is redacted, refused, or never
  # persisted has to contain a token, so these files are where fabricated
  # credentials live on purpose. This is the broadest entry here and the one that
  # gives up the most: a real credential pasted into a test file is not caught by
  # this gate. GitHub's own push protection is the second line for that case.
  '''(^|/)test/''',
  '''(^|/)tests/''',
  '''(^|/)__tests__/''',
  '''\.test\.ts$''',
  '''(^|/)fixtures?/''',
  # Demo seeding. The recordings run against a throwaway HOME with fabricated
  # tokens precisely so no recording can capture a real one.
  '''^scripts/demos/''',
  '''^assets/tapes/''',
  # Changelogs and docs quote the examples users type. The `ghp_R2d2...` in the
  # secrets chapter decodes from base64 to "gh token example", which is the
  # giveaway that these are prose about credentials rather than credentials.
  '''(^|/)CHANGELOG\.md$''',
  '''^docs/''',
  # Argot dictionaries are substitution tables built from other repositories'
  # prose. A high-entropy string here is a compressed handle, not a credential.
  '''\.AGENTS\.dict$''',
]
regexes = [
  # Public OAuth client identifiers. A client id is published by construction: it
  # ships inside the vendor's own editor extension and identifies the application
  # rather than authorizing anything. Both flows are PKCE, so there is no paired
  # client secret that could leak with it.
  '''36f2a70cddeb5a0889d4fd8295c241b7e9848e89cf9e599d0eed2d8e5350fbf5''',
  '''b1a00492-073a-47ea-816f-4c329264a828''',
  # Anthropic beta feature flags. `oauth-2025-04-20` and its neighbours are
  # opt-in API version strings sent in the anthropic-beta header, published in
  # Anthropic's own docs, and the entropy rule reads a dated slug next to another
  # dated slug as a key.
  '''(oauth|interleaved-thinking|context-management|prompt-caching-scope|structured-outputs|claude-code|mid-conversation-system|advanced-tool-use|extended-cache-ttl|fine-grained-tool-streaming)-20\d\d''',
]
commits = [
  # Two historical commits carry the claude-trace MITM keypair and the Perplexity
  # OAuth user-agent string. The keypair was a self-signed loopback debug key used
  # with NODE_TLS_REJECT_UNAUTHORIZED=0, worth nothing to anyone who has it, and
  # HEAD mints its pair at runtime instead. History is not rewritten to remove a
  # worthless key: a force push over a public default branch costs every clone and
  # every open reference, which is a real price for no gain in secrecy. The
  # per-push gate never reaches these commits; this entry is only so the
  # whole-history fallback scan stays honest instead of red-by-default.
  "6dbf3350c2e8a6e4cfe3aa13c311e6d09a30f33a",
  "0ed9680e8d9fea6ee2ace4938bbf9edfa391b2b0",
]
