[package]
name = "veyyon-desktop-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Headless rendering of the veyyon desktop views to PNG, for tests and captures"

[lints]
workspace = true

# Test and capture tooling only: no crate that ships depends on this one.
# `test-support` on `gpui_platform` turns on GPUI's `test-support`, which a
# headless session needs to report an operating-system motion preference, and
# which changes how a window draws; a dependency's features reach every binary
# that links it, so a production crate never names this crate outside
# `[dev-dependencies]`.
[dependencies]
anyhow = { workspace = true }
gpui_platform = { workspace = true, features = ["test-support"] }
# The text system every headless context shapes through, and the Vulkan
# renderer off macOS.
gpui_wgpu = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
veyyon-desktop-app = { workspace = true }
veyyon-desktop-model = { workspace = true }
veyyon-desktop-ui = { workspace = true }
veyyon-gpui = { workspace = true }
