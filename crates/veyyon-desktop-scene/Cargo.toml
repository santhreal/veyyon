[package]
name = "veyyon-desktop-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Deterministic scene construction, headless rasterization and clutter metric evaluation for the veyyon desktop front end"

[lints]
workspace = true

[dependencies]
image = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
veyyon-desktop-model = { workspace = true }
# The headless offscreen path is the kit's: its `headless` feature builds the
# renderer for the current OS and the app context a frame is shaped in.
veyyon-desktop-kit = { workspace = true, features = ["headless"] }
veyyon-desktop-tokens = { workspace = true }
veyyon-gpui = { workspace = true }

[dev-dependencies]
veyyon-desktop-surface = { workspace = true }
