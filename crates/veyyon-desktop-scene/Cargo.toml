[package]
name = "veyyon-desktop-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Deterministic scene construction, headless rasterization and clutter metric evaluation for the veyyon desktop front end"

[lints]
workspace = true

[dependencies]
image = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
veyyon-desktop-model = { workspace = true }
veyyon-desktop-tokens = { workspace = true }
veyyon-gpui = { workspace = true }

# The headless offscreen path needs the platform crate for the current OS's
# renderer and the wgpu crate for the text system a frame is shaped with. Both
# reach the scene crate through veyyon-gpui, but they are named directly here
# because this crate constructs the context rather than only rendering into one.
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true }

[dev-dependencies]
