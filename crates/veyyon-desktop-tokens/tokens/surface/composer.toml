[meta]
version = 1
name = "surface_composer"

[geometry]
max_width_px = 768
rest_height_px = 70
growth_cap_px = 200
radius_outer = "xxl"
radius_inner = "xl"
padding_top = "s7"
padding_bottom = "s6"
padding_horizontal = "s8"
hairline_stroke = "hairline"

[material]
blur_px = 16
saturation = 1.08
ground_opacity = 0.80

# While the composer holds focus it carries a glow in the focus colour, tight
# to the edge so it reads as a lit rim rather than a second shadow.
[focus_glow]
blur_px = 4
spread_px = 1
opacity = 0.28

[footer]
max_controls = 5
compact_threshold_px = 600
hysteresis_px = 16

[run_bar]
max_controls = 4
compact_threshold_px = 560
label_size = "small"

[opening_line]
max_width_px = 768
type_size = "lead"
weight = "regular"

# One card per attached image or clip: a square thumbnail at card_height beside the name and size.
[attachments]
card_height_px = "s12"
card_max_width_px = 240
card_radius = "md"
