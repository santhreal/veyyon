# Shell chrome: the window and the titlebar (§4.1).
#
# Every value carries its derivation in §4.1. The titlebar is 52px because it
# holds one 28px control row with 12px above and below; the minimum window is
# 768px of prose plus 16px of gutters with the queue collapsed (§5.7).
#
# Platform control insets are not declared here. macOS traffic lights take 78px
# and Windows reports its caption overlay width at run time, so the inset is the
# declared value plus whatever the platform adds.

[meta]
version = 1
name = "surface_shell"

[window]
min_width_px = 800
min_height_px = 560

[titlebar]
height_px = 52
control_px = 28
control_gap_px = "s4"
inset_left_px = "s6"
inset_right_px = "s6"
rename_width_px = 320

# Grain is level 0 only, never on canvas or float (§6.5). The tile is a 128x128
# R8 blue-noise texture generated once at startup.
[grain]
tile_px = 128
opacity = 0.025

# A control whose capability request is in flight renders in place at this
# strength, with activation suppressed and no spinner under 400ms (§4.3). It is
# declared once here because every surface that draws a pending control reads
# the same value; a surface that picked its own produced the measured defect
# where the terminal drawer's action strip fell to 0.104 and its labels stopped
# being legible rather than reading as dimmed.
[gate]
pending_strength = 0.6
# A control the operator can see and cannot activate renders muted at this
# strength. That covers a capability the host reported unavailable, whose
# reason stays readable at the control with no retry (§4.3), and a control a
# primitive draws disabled, which resolves the same strength through
# ControlMetrics::disabled_opacity. It sits below pending_strength so a
# request in flight reads as in flight rather than as refused.
unavailable_strength = 0.4
