[meta]
version = 1
name = "surface_transcript"

[layout]
column_width_px = 768
user_turn_width_ratio = 0.80

[rhythm]
adjacent_same_kind_gap = "s0"
group_blocks_gap       = "s2"
turn_groups_gap        = "s4"
turns_gap              = "s8"

[user_turn]
ground = "inset"
padding = "s6"
radius_outer = "xl"
radius_trailing = "xs"
type_size = "read"

[assistant_turn]
type_size = "read"

[chrome.collapsed]
height_px = "s10"
event_line_height_px = "s6"

[chrome.caps]
invoke_mono_pane_max_height_px = 240
code_fence_max_height_px = 320
image_max_height_px = 400
plan_body_max_height_px = 400
plan_fade_height_px = "s13"
table_row_height_px = 18

# A tool view draws denser rows than prose: a code, diff or status line sits on
# a one-pixel vertical rhythm, below the spacing scale's first step because a
# code line that takes `s1` above and below reads as prose, a diff line number
# occupies a fixed gutter, a notice indents its body under the icon that
# headlines it, and a result summary beside a call header stops before it
# crowds the name.
[tool_view]
row_pad_y_px = 1
line_number_gutter_px = 36
notice_body_indent_px = 22
result_summary_max_width_px = 240
