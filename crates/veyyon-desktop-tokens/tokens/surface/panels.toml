[meta]
version = 1
name = "surface_panels"

[right_panel]
min_width_px = 360
default_width_px = 540
max_viewport_ratio = 0.70
container_margin_px = 360
overlay_scrim_blur_px = 16

[terminal_drawer]
min_height_px = 180
max_viewport_ratio = 0.75
cell_width_px = 7.2
cell_height_px = 16.0
min_columns = 80
min_rows = 11
process_row_height_px = "s10"
process_dot_px = "s3"
[tabs]
height_px = "s10"
gap_px = "s1"
max_width_px = 160
close_hit_px = "s8"
pending_dot_px = "s3"

[chrome]
row_height_px = 28
resize_handle_hit_px = "s4"
resize_handle_line_px = "hairline"

[tree]
indent_base_px = "s4"
indent_step_px = "s7"
row_height_px = "s10"
font_size = "micro"

[diff]
row_height_px = 18
font_size = "body"
gutter_width_px = 44
sign_width_px = "s6"
hunk_header_height_px = "s10"
added_removed_alpha = 0.85
intraline_alpha = 0.35

# A monospace pane fades the line that runs past its right edge, and draws its
# own scroll rail under it.
[mono_pane]
overflow_width_px = 280
edge_fade_alpha = 0.85
scroll_track_alpha = 0.30
scroll_thumb_alpha = 0.60
scroll_thumb_ratio = 0.35
