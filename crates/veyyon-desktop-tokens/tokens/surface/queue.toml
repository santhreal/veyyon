[meta]
version = 1
name = "surface_queue"

[geometry.width]
default_px = 256
min_px = 208
max_viewport_delta_px = 640
floor_max_px = 208
resize_handle_hit_px = "s4"

[geometry.insets]
content_inset = "s4"
row_inset = "s4"

[geometry.row_heights]
card_px = 78
line_px = 36
section_header_px = "s9"

[geometry.card_layout]
padding_top = "s4"
padding_bottom = "s4"
padding_horizontal = "s4"
header_gap = "s1"
body_gap = "s2"
badge_height_px = "s9"
title_height_px = "s9"
subtitle_height_px = "s8"

[geometry.section_layout]
gap_above = "s6"
gap_below = "s2"

[geometry.footer]
height_px = 36
inset = "s4"
gear_size_px = "s8"

[geometry.limits]
max_hover_actions = 2
parked_initial_page_size = 25

# A card states open, selected, in flight and at rest with the strength it
# draws a role at, rather than with a colour role per state (§6.4).
[geometry.card_state]
open_edge_alpha = 0.55
selected_edge_alpha = 0.40
resting_edge_alpha = 0.45
in_flight_title_alpha = 0.70

[geometry.tree]
indent_step_px = "s7"
max_depth = 4
