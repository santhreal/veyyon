# Reference dark theme (§6.9): the brand's Titanium palette. Pitch black
# ground, silver structure, ember as the one accent. Cyan, blue and purple are
# not chrome, so the kind tints are drawn from ember, amber, green, red and the
# silver ladder.
#
# Declares exactly the roles in ColorRole, no additions and no omissions. Every
# rendered pair clears its §6.9 floor: text at body size and above against all
# five grounds at 4.5:1, `micro` text at 3:1, each tint ink on its own fill at
# 4.5:1, and accent_foreground on accent at 4.5:1. The tightest pair here is
# placeholder on float at 4.11:1.
#
# Regenerate contrast figures with:
#   cargo test -p veyyon-desktop-tokens --test a_bundled_theme_declares_every_role

[meta]
name = "veyyon dark"
appearance = "dark"
version = 1

[role]
# Elevation 0 through 4, §6.5. Each step is lighter than the one below it.
ground = "#000000"
rail = "#0a0c0f"
canvas = "#101318"
inset = "#171b21"
float = "#1e232a"
hairline = "#2c323b"

foreground = "#fafafa"
secondary = "#c6cbd4"
muted = "#8b95a3"
placeholder = "#79838f"

accent = "#f0862e"
accent_foreground = "#000000"
focus = "#f5a15c"

[tint.working]
fill = "#3d2510"
ink = "#f0a66b"

[tint.attention]
fill = "#4a3410"
ink = "#f2cd8a"

[tint.approve]
fill = "#123a26"
ink = "#9adcb6"

[tint.input]
fill = "#262c35"
ink = "#c6cbd4"

[tint.plan]
fill = "#333a44"
ink = "#e6e9ee"

[tint.due]
fill = "#4a2f14"
ink = "#f0c496"

[tint.done]
fill = "#1e2a1c"
ink = "#a8c9a0"

[tint.error]
fill = "#4d1a1e"
ink = "#f5a8ae"
