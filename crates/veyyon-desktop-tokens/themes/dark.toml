# Reference dark theme (§6.9).
#
# Declares exactly the roles in ColorRole, no additions and no omissions. Every
# rendered pair clears its §6.9 floor: text at body size and above against all
# five grounds at 4.5:1, `micro` text at 3:1, each tint ink on its own fill at
# 4.5:1, and accent_foreground on accent at 4.5:1. The tightest pair here is
# placeholder on float at 3.95:1.
#
# Regenerate contrast figures with:
#   cargo test -p veyyon-desktop-tokens --test a_bundled_theme_declares_every_role

[meta]
name = "veyyon dark"
appearance = "dark"
version = 1

[role]
# Elevation 0 through 4, §6.5. Each step is lighter than the one below it.
ground = "#0d0f12"
rail = "#12151a"
canvas = "#16191f"
inset = "#1c2027"
float = "#21262e"
hairline = "#2c323b"

foreground = "#e8ecf2"
secondary = "#b3bcc9"
muted = "#8b95a3"
placeholder = "#79838f"

accent = "#4a8cf7"
accent_foreground = "#04101f"
focus = "#6aa3ff"

[tint.working]
fill = "#12314f"
ink = "#a9cdf7"

[tint.attention]
fill = "#4a3410"
ink = "#f2cd8a"

[tint.approve]
fill = "#123a26"
ink = "#9adcb6"

[tint.input]
fill = "#2d2350"
ink = "#c4b4f5"

[tint.plan]
fill = "#123a3c"
ink = "#93d6d8"

[tint.due]
fill = "#4a2f14"
ink = "#f0c496"

[tint.done]
fill = "#1e2a1c"
ink = "#a8c9a0"

[tint.error]
fill = "#4d1a1e"
ink = "#f5a8ae"
