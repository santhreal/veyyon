[package]
name = "veyyon-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The veyyon desktop front end's view of GPUI, pinned to the santhreal/zed fork carrying patches P1-P10"

[lints]
workspace = true

# GPUI is a required dependency, not a feature.
#
# It was briefly optional, on the reasoning that a host without Vulkan
# development libraries could not build it. That reasoning is wrong: blade
# reaches Vulkan through ash's dynamically loaded entry point, so the build
# needs no headers, and the loader it dlopens at run time
# (libvulkan.so.1, package libvulkan1) is present on every host that can run a
# GPU application at all. The cost of the feature was that the default
# `cargo check` compiled none of the renderer, so the Rust gate stayed green
# across a front end that did not build.
[dependencies]
gpui = { workspace = true }
