[package]
name = "veyyon-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The Veyyon desktop front end's integration with Santh GPUI"

[lints]
workspace = true

# GPUI is a required dependency, not a feature.
#
# It was briefly optional, on the reasoning that a host without Vulkan
# development libraries could not build it. That reasoning is wrong: the wgpu
# renderer reaches Vulkan through ash's dynamically loaded entry point, so the
# build needs no headers, and the loader it dlopens at run time
# (libvulkan.so.1, package libvulkan1) is present on every host that can run a
# GPU application at all. The cost of the feature was that the default
# `cargo check` compiled none of the renderer, so the Rust gate stayed green
# across a front end that did not build.
#
# `gpui_platform` and `gpui_wgpu` use the same pinned Santh GPUI revision. The
# headless offscreen path the integration tests render through needs both: the
# platform crate builds the renderer for the current OS, and the wgpu crate
# supplies the text system a frame is shaped with. They are dev-dependencies:
# `test-support` on `gpui_platform` turns on GPUI's `test-support`, which
# draws every dirty window at the end of each effect flush instead of on the
# platform's frame clock and runs the leak detector at quit, and a
# dependency's features reach every binary that links this crate.
[dependencies]
gpui = { workspace = true }

[dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true }
veyyon-desktop-scene = { workspace = true }
