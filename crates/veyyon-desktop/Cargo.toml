[package]
name = "veyyon-desktop"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# A dependency's features reach this binary: nothing here may turn on GPUI's
# `test-support`, `bench-support` or `leak-detection`, and the headless scene
# crate is never a dependency
# (`tests/the-shipped-binary-links-no-test-only-code.rs`).
[dependencies]
bytes.workspace = true
clap.workspace = true
gpui_platform = { workspace = true, features = ["x11"] }
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
veyyon-desktop-app.workspace = true
veyyon-desktop-model.workspace = true
veyyon-desktop-ui.workspace = true
veyyon-gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
strum.workspace = true
veyyon-test-scratch.workspace = true

[[bin]]
name = "veyyon-desktop"
path = "src/main.rs"
