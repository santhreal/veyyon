# grep implemented from scratch on top of the ripgrep libraries (grep-regex +
# grep-searcher), with I/O and path resolution routed through veyyon-uutils-ctx so it
# can run in-process as a shell builtin. Entry point: `veyyon_uu_grep::run`.
[package]
name = "veyyon-uu-grep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "grep ~ ripgrep-backed pattern search (in-process shell builtin)"

[lib]
path = "src/lib.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
veyyon-uutils-ctx.workspace = true
veyyon-grep-kernel.workspace = true
veyyon-walker.workspace = true
grep-cli = "0.1"
grep-matcher.workspace = true
grep-pcre2.workspace = true
grep-printer = "0.3"
grep-regex.workspace = true
regex-automata.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
globset.workspace = true
serde_json.workspace = true

[dev-dependencies]
veyyon-test-scratch.workspace = true
parking_lot.workspace = true
