# Private headless output for the desktop bench. session.sh appends one
# `exec` line that records the session's WAYLAND_DISPLAY and DISPLAY.
xwayland force
output HEADLESS-1 mode 1600x1000@60Hz position 0,0 scale 1
default_border none
default_floating_border none
focus_follows_mouse no
# Tile every X11 window, so both apps draw into the same 1600x1000 area
# whatever size hints they set.
for_window [shell="xwayland"] floating disable
