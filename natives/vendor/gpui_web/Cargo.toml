[package]
name = "gpui_web"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
autoexamples = false


[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { path = "../gpui", default-features = false }
scheduler = { path = "../scheduler" }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { path = "../gpui_wgpu" }
http_client = { path = "../http_client" }
anyhow = "1.0.86"
futures = "0.3.32"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"
# Forked because upstream is unmaintained and its worker bootstrap still calls
# the wasm-bindgen init function with the positional arguments deprecated in 0.2.93.
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = [
    "es_modules",
], optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }

[package.metadata.cargo-shear]
ignored = ["scheduler"]

[workspace]
